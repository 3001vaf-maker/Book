services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: book_staging
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book_staging_local
    ports:
      - "54329:5432"
    volumes:
      - book_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d book_staging"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://book:book_staging_local@db:5432/book_staging?schema=public
      JWT_SECRET: book-staging-local-only-change-before-remote-use
      OWNER_EMAIL: staging@book.local
      OWNER_PASSWORD: BookStaging-2026!
      OWNER_TENANT_NAME: Book Staging
      FRONTEND_ORIGIN: http://localhost:8080
      PORT: 3000
    command: ["sh", "-c", "npx prisma migrate deploy && npm run seed:owner && npm run seed:staging && node dist/main.js"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-c", "node scripts/build-pages.mjs && node scripts/serve-staging.mjs _site 8080"]
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  book_staging_pg:
