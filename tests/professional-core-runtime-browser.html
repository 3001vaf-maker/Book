<script type="module">
const result = document.querySelector('#result');
const failures = [];
let stage = 'boot';
const mark = (name) => {
  stage = name;
  result.textContent = 'running: ' + name;
  document.documentElement.dataset.professionalRuntimeStage = name;
};
const ok = (condition, message) => { if (!condition) failures.push(stage + ': ' + message); };
const wait = (ms = 120) => new Promise((resolve) => window.setTimeout(resolve, ms));
const pointer = (target, type, x, y, id = 1) => target?.dispatchEvent(new PointerEvent(type, {
  bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',clientX:x,clientY:y,button:0,
}));
for (const name of ['setPointerCapture','releasePointerCapture']) {
  Object.defineProperty(Element.prototype, name, { configurable:true, value(){ } });
}
Object.defineProperty(Element.prototype, 'hasPointerCapture', { configurable:true, value(){ return true; } });
window.addEventListener('error', (event) => failures.push(stage + ': window error: ' + (event.error?.message || event.message)));
window.addEventListener('unhandledrejection', (event) => failures.push(stage + ': rejection: ' + String(event.reason?.message || event.reason || 'unknown')));

mark('import-core');
await import('/core.js');

const app = document.querySelector('#app');
const waitFor = async (predicate, label, attempts = 80) => {
  for (let i=0;i<attempts;i+=1) {
    if (predicate()) return true;
    await wait(75);
  }
  failures.push(stage + ': timeout waiting for ' + label);
  return false;
};
await waitFor(() => app.querySelector('[data-v2-app].v2-app--workspace'), 'professional workspace');

const shell = () => app.querySelector(':scope > [data-v2-app].v2-app--workspace');
const edge = () => shell()?.querySelector('[data-v2-edge-swipe]');
const fDeck = () => shell()?.querySelector('[data-v2-card-deck][data-v2-deck-level="f"]');
const eDeck = () => shell()?.querySelector('[data-v2-card-deck][data-v2-deck-level="e"]');
const fCard = (id) => shell()?.querySelector('[data-v2-root-item="' + id + '"]');
const eCard = (id) => shell()?.querySelector('[data-v2-secondary-item="' + id + '"]');
const ownerCount = () => Number(edge()?.dataset.v2EdgeOwners || 0);
const initialShell = shell();

ok(Boolean(initialShell), 'real professional workspace did not boot');
ok(Boolean(fCard('people')), 'real professional F People missing');
ok(Boolean(fCard('finance')), 'real professional F Finance missing');
ok(Boolean(fCard('journal')), 'real professional F Journal missing');
ok(ownerCount() === 1, 'professional workspace must boot with one edge owner');

const openF = async (pointerId, label) => {
  mark('edge-to-f-' + label);
  const e = edge();
  pointer(e,'pointerdown',10,320,pointerId);
  pointer(e,'pointermove',48,322,pointerId);
  pointer(e,'pointerup',48,322,pointerId);
  await wait(140);
  ok(shell()?.classList.contains('is-deck-open'), 'edge swipe failed to open F');
  ok(!shell()?.classList.contains('is-e-open'), 'root Z edge swipe incorrectly reopened E');
  ok(ownerCount() === 1, 'edge owner count changed after opening F');
};

const tapAndOpen = async (deck, target, pointerId, label) => {
  mark('select-' + label);
  const beforeShell = shell();
  if (!target) {
    ok(false, label + ' target card missing before selection');
    return;
  }
  pointer(target,'pointerdown',190,390,pointerId);
  pointer(target,'pointerup',190,390,pointerId);
  mark('click-' + label);
  target.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,clientX:190,clientY:390}));
  mark('clicked-' + label);
  await wait(180);
  ok(shell() === beforeShell && shell() === initialShell, label + ' rebuilt the whole professional FEZ shell');
  ok(ownerCount() === 1, label + ' left duplicate FEZ owners');
};

await openF(1,'people');
await tapAndOpen(fDeck(), fCard('finance'), 11, 'finance');
ok(shell()?.classList.contains('is-deck-open') && shell()?.classList.contains('is-e-open'), 'Finance did not open real E deck');
ok(Boolean(eCard('cash')), 'Finance E Cash missing');
ok(Boolean(eCard('dds')), 'Finance E DDS missing');

await tapAndOpen(eDeck(), eCard('cash'), 12, 'finance-cash');
ok(!shell()?.classList.contains('is-deck-open'), 'Cash selection did not enter Z');
ok(Boolean(shell()?.querySelector('[data-v2-workspace-a]')), 'Cash A/settings control missing');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.trim() === '+', 'Cash C add control missing');
ok(Boolean(shell()?.querySelector('[data-v2-workspace-chat]')), 'Cash D chat control missing');

const cashSections = [...(shell()?.querySelectorAll('.v2-section') || [])];
ok(cashSections.length === 3, 'Cash Z1 must contain exactly three sections');
ok(cashSections.map((section) => section.querySelector('.v2-section__title')?.textContent.trim()).join('|') === 'Кошельки|Инвестиции|Займ',
  'Cash Z1 section order must be Wallets, Investments, Loan');
ok(Boolean(cashSections[0]?.querySelector('.entity-card-rail')), 'Cash wallets section must use horizontal layout');
ok(!cashSections[1]?.querySelector('.entity-visual-card'), 'Cash investments section must start empty');
ok(!cashSections[2]?.querySelector('.entity-visual-card'), 'Cash loan section must start empty');

mark('cash-financial-operations');
shell()?.querySelector('[data-v2-workspace-a]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(35);
let cashRootSettings = document.querySelector('[data-shared-profile-settings-menu]');
ok(Boolean(cashRootSettings), 'Cash A/settings did not open');
ok(Boolean(cashRootSettings?.querySelector('[data-shared-profile-action="financial-operations"]')),
  'Cash A/settings must contain Financial operations');
cashRootSettings?.querySelector('[data-shared-profile-action="financial-operations"]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(45);

let cashOperationsModal = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
ok(Boolean(cashOperationsModal), 'Cash Financial operations did not open as bottom modal');
ok(cashOperationsModal?.textContent.includes('Доход / Расход'), 'Cash operations Income/Expense section missing');
ok(!cashOperationsModal?.textContent.includes('Займы'), 'Cash root operations must not duplicate Loan entity operations');
ok(!cashOperationsModal?.textContent.includes('Инвестиции'), 'Cash root operations must not duplicate Investment entity operations');
ok(cashOperationsModal?.textContent.includes('Переводы'), 'Cash operations Transfers section missing');
ok(Boolean(cashOperationsModal?.querySelector('[data-finance-operation-action="manual-income"]')), 'Cash Income action missing');
ok(Boolean(cashOperationsModal?.querySelector('[data-finance-operation-action="manual-expense"]')), 'Cash Expense action missing');
ok(!cashOperationsModal?.querySelector('[data-finance-operation-action="loan-received"]'), 'Cash root must not expose Receive loan');
ok(!cashOperationsModal?.querySelector('[data-finance-operation-action="investment-received"]'), 'Cash root must not expose Receive investment');
ok(Boolean(cashOperationsModal?.querySelector('[data-finance-operation-action="transfer"]')), 'Cash Transfer action missing');
ok(!shell()?.querySelector('[data-v2-z-layer]'), 'Cash operation choice must stay a bottom modal, not Z');

cashOperationsModal?.querySelector('[data-finance-operation-action="transfer"]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(55);
let cashOperationLayer = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(Boolean(cashOperationLayer), 'Cash selected operation did not open Z2');
ok(cashOperationLayer?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Перевод между кошельками',
  'Cash operation Z2 B title is wrong');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.trim() === 'Сохранить',
  'Cash operation Z2 C must be Save');
ok(Boolean(cashOperationLayer?.querySelector('[data-finance-special-form]')), 'Cash operation Z2 form missing');
ok(!cashOperationLayer?.querySelector('button[type="submit"]'), 'Cash operation form must not duplicate Save inside Z2');
ok(!document.querySelector('[data-modal][data-v2-layer-kind="bottom"]'),
  'Cash operation picker remained open behind Z2');
cashOperationLayer?.v2Close?.();
await wait(35);
ok(!shell()?.querySelector('[data-v2-z-layer]'), 'Cash operation Z2 did not close');
ok(Boolean(shell()?.querySelector('[data-v2-workspace-a]')), 'Cash A was not restored after operation Z2');

shell()?.querySelector('[data-v2-workspace-primary]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(35);
let cashCreateMenu = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
ok(Boolean(cashCreateMenu), 'Cash C must open one bottom create modal');
const cashCreateLabels = [...(cashCreateMenu?.querySelectorAll('.ui-button') || [])].map((node) => node.textContent.trim());
ok(cashCreateLabels.join('|') === '+ Добавить кошелек|+ Добавить инвестицию|+ Добавить займ',
  'Cash create modal must contain exactly wallet, investment and loan actions');

cashCreateMenu?.querySelector('[data-cash-create-investment]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(35);
let investmentTermsZ = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
let investmentForm = investmentTermsZ?.querySelector('[data-investment-terms-form]');
ok(Boolean(investmentForm), 'Cash Add investment must open shared Investment terms Z');
ok(investmentTermsZ?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Условия инвестиции',
  'New investment must open Investment terms Z');
const investmentName = investmentForm?.querySelector('input[name="investmentName"]');
if (investmentName) investmentName.value = 'Инвестиция Runtime';
investmentForm?.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
await wait(40);
ok(!shell()?.querySelector('[data-v2-z-layer]'), 'Saved new investment must close Investment terms Z');
let investmentSection = [...(shell()?.querySelectorAll('.v2-section') || [])]
  .find((section) => section.querySelector('.v2-section__title')?.textContent.trim() === 'Инвестиции');
ok(Boolean(investmentSection?.querySelector('.entity-card-rail .entity-visual-card')), 'Saved investment must create a card in the horizontal Investments section');
ok(investmentSection?.textContent.includes('Инвестиция Runtime'), 'Saved investment card name missing');

shell()?.querySelector('[data-v2-workspace-primary]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(30);
cashCreateMenu = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
cashCreateMenu?.querySelector('[data-cash-create-loan]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(30);
let loanForm = document.querySelector('[data-loan-form]');
ok(Boolean(loanForm), 'Cash Add loan must open the entity form');
const loanName = loanForm?.querySelector('input[name="loanName"]');
if (loanName) loanName.value = 'Займ Runtime';
loanForm?.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
await wait(35);
let loanSection = [...(shell()?.querySelectorAll('.v2-section') || [])]
  .find((section) => section.querySelector('.v2-section__title')?.textContent.trim() === 'Займ');
ok(Boolean(loanSection?.querySelector('.entity-card-rail .entity-visual-card')), 'Saved loan must create a card in the horizontal Loan section');
ok(loanSection?.textContent.includes('Займ Runtime'), 'Saved loan card name missing');

mark('cash-loan-entity');
let loanCard = loanSection?.querySelector('[data-finance-entity-type="loan"][data-finance-entity-id]');
loanCard?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(35);
let loanZ2 = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(Boolean(loanZ2), 'Loan card did not open its Z1/history surface');
ok(loanZ2?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Займ Runtime',
  'Loan card B must use the entity name');
shell()?.querySelector('[data-v2-workspace-a]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(30);
let loanSettings = document.querySelector('[data-shared-profile-settings-menu]');
const loanActionIds = [...(loanSettings?.querySelectorAll('[data-shared-profile-action]') || [])]
  .map((node) => node.dataset.sharedProfileAction);
ok(loanActionIds.join('|') === 'appearance|terms|financial-operation',
  'Loan A must contain exactly View, Loan terms and Financial operation');

loanSettings?.querySelector('[data-shared-profile-action="terms"]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(35);
let loanTermsZ = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(loanTermsZ?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Условия займа',

ok(!paymentReceipt?.textContent.includes('|'), 'Payment receipt must not render textual separator characters');

const paymentGroups = [...(paymentReceipt?.querySelectorAll('.read-only-sheet__group') || [])];
ok(paymentGroups.length === 3, 'Payment receipt must contain service, identity/composition and payment groups');

const paymentGroupRows = paymentGroups.map((group) => [...group.querySelectorAll('.read-only-sheet__row')]);
ok(paymentGroupRows[0]?.[0]?.querySelector('span')?.textContent.trim() === 'Бьюти тория',
  'Payment receipt workplace must be first and left aligned');
ok(paymentGroupRows[0]?.[1]?.querySelector('span')?.textContent.includes(' - '),
  'Payment receipt procedure factual date and time must be one left row separated by dash');

ok(paymentGroupRows[1]?.[0]?.querySelector('span')?.textContent.trim() === '0012',
  'Payment receipt UEI must be a separate left row');
ok(paymentGroupRows[1]?.[1]?.querySelector('span')?.textContent.trim() === 'Татьяна Проверка',
  'Payment receipt full name must be a separate left row');
const haircutRow = paymentGroupRows[1]?.find((row) => row.querySelector('span')?.textContent.trim() === 'Стрижка');
const colorRow = paymentGroupRows[1]?.find((row) => row.querySelector('span')?.textContent.trim() === 'Окраска');
ok(Boolean(haircutRow?.querySelector('strong')?.textContent.includes('900')),
  'Payment receipt procedure price must be on the right of the same row');
ok(Boolean(colorRow?.querySelector('strong')?.textContent.includes('600')),
  'Payment receipt second procedure price must be on the right of the same row');

const cashRow = paymentGroupRows[2]?.find((row) => row.querySelector('span')?.textContent.trim() === 'Наличные');
const cashlessRow = paymentGroupRows[2]?.find((row) => row.querySelector('span')?.textContent.trim() === 'Безналичные');
const totalRow = paymentGroupRows[2]?.find((row) => row.querySelector('span')?.textContent.trim() === 'Итого');
ok(Boolean(cashRow?.querySelector('strong')?.textContent.includes('1 000')),
  'Split payment cash amount must be on the right');
ok(Boolean(cashlessRow?.querySelector('strong')?.textContent.includes('500')),
  'Split payment cashless amount must be on the right');
ok(Boolean(totalRow?.classList.contains('is-strong') && totalRow?.querySelector('strong')?.textContent.includes('1 500')),
  'Payment receipt total must be the final strong row');

await closeTopDdsZ(122, 'payment-receipt');
ok(!shell()?.querySelector('[data-v2-z-layer]'), 'DDS payment receipt Z2 did not close by swipe');

mark('dds-export');
let settings = await openDdsSettings();
settings?.querySelector('[data-finance-dds-tool="excel"]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(50);
let ddsLayer = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(Boolean(ddsLayer), 'DDS Excel did not open Z2');
ok(ddsLayer?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Выгрузка ДДС',
  'DDS Excel Z2 B title is wrong');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.trim() === 'Выгрузить',
  'DDS Excel Z2 C must be Export');
ok(Boolean(ddsLayer?.querySelector('[data-finance-dds-export-form]')), 'DDS Excel filters form missing');
ok(Boolean(ddsLayer?.querySelector('[name="from"]')), 'DDS Excel from filter missing');
ok(Boolean(ddsLayer?.querySelector('[name="to"]')), 'DDS Excel to filter missing');
ok(Boolean(ddsLayer?.querySelector('[data-date-picker]')), 'DDS Excel must use the shared calendar');
ok(!ddsLayer?.querySelector('input[type="date"],input[type="datetime-local"],input[type="time"]'),
  'DDS Excel must not expose native browser date/time controls');
ok(Boolean(ddsLayer?.querySelector('[name="kind"]')), 'DDS Excel operation filter missing');
ok(Boolean(ddsLayer?.querySelector('[name="walletId"]')), 'DDS Excel wallet filter missing');
ok(Boolean(ddsLayer?.querySelector('[name="status"]')), 'DDS Excel status filter missing');
ok(!document.querySelector('[data-modal][data-v2-layer-kind="bottom"]'),
  'DDS settings bottom modal remained behind Excel Z2');
await closeTopDdsZ(121, 'export');
ok(!shell()?.querySelector('[data-v2-z-layer]'), 'DDS Excel Z2 did not close by swipe');
ok(Boolean(shell()?.querySelector('[data-v2-workspace-a]')), 'DDS A was not restored after Excel Z2');

mark('dds-articles');
settings = await openDdsSettings();
settings?.querySelector('[data-finance-dds-tool="articles"]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(50);
ddsLayer = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(Boolean(ddsLayer), 'DDS Articles did not open Z2');
ok(ddsLayer?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Статьи',
  'DDS Articles Z2 B title is wrong');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.trim() === '+',
  'DDS Articles Z2 C must be Add');
ok(!document.querySelector('[data-modal][data-v2-layer-kind="bottom"]'),
  'DDS settings modal remained open behind Articles Z2');

shell()?.querySelector('[data-v2-workspace-primary]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(50);
let articleEdit = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(Boolean(articleEdit), 'DDS Article Add did not open next Z layer');
ok(articleEdit?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Новая статья',
  'DDS Article editor B title is wrong');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.trim() === 'Сохранить',
  'DDS Article editor C must be Save');
ok(Boolean(articleEdit?.querySelector('[data-finance-article-form]')), 'DDS Article editor form missing');
ok(!articleEdit?.querySelector('button[type="submit"]'), 'DDS Article editor must not duplicate Save inside Z');
await closeTopDdsZ(123, 'article-edit');
ok([...((shell()?.querySelectorAll('[data-v2-z-layer]')) || [])].length === 1,
  'DDS Article editor did not return to Articles Z2');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.trim() === '+',
  'DDS Articles C was not restored after closing editor');
await closeTopDdsZ(124, 'articles');
ok(!shell()?.querySelector('[data-v2-z-layer]'), 'DDS Articles Z2 did not close by swipe');
ok(Boolean(shell()?.querySelector('[data-v2-workspace-a]')), 'DDS A was not restored after Articles Z2');

await openF(3,'dds');
await tapAndOpen(fDeck(), fCard('journal'), 15, 'journal');
ok(shell()?.classList.contains('is-e-open'), 'Journal did not open real E deck');
ok(Boolean(eCard('day')), 'Journal E Day missing');
ok(Boolean(eCard('list')), 'Journal E List missing');

await tapAndOpen(eDeck(), eCard('day'), 16, 'journal-day');
ok(!shell()?.classList.contains('is-deck-open'), 'Journal Day selection did not enter Z');
await wait(80);
ok(shell()?.querySelector('.v2-header__title')?.textContent.trim() === 'Студия Тест',
  'Journal Day B must be selected workplace');
ok(Boolean(shell()?.querySelector('[data-v2-workspace-a]')), 'Journal Day A/settings missing');
ok(Boolean(shell()?.querySelector('[data-v2-workspace-chat]')), 'Journal Day D/general chat missing');

mark('journal-day-settings');
shell()?.querySelector('[data-v2-workspace-a]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(40);
let journalSettings = document.querySelector('[data-shared-profile-settings-menu]');
ok(Boolean(journalSettings), 'Journal Day A did not open shared settings');
const journalActionIds = [...(journalSettings?.querySelectorAll('[data-shared-profile-action]') || [])]
  .map((node) => node.dataset.sharedProfileAction);
ok(journalActionIds.includes('workplace') && journalActionIds.includes('z-report'),
  'Journal Day A must contain Workplace and Z-report');
ok(!journalActionIds.includes('day-off'),
  'Journal Day must hide Day-off action while an active record exists');

mark('journal-day-workplace-selector');
journalSettings?.querySelector('[data-shared-profile-action="workplace"]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(40);
let journalWorkplaceModal = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
const journalWorkplaceInput = journalWorkplaceModal?.querySelector('input[name="journalWorkplaceMode"]');
ok(Boolean(journalWorkplaceInput), 'Journal Workplace must use shared Select in bottom modal');
const journalWorkplaceTrigger = journalWorkplaceInput?.closest('.ui-select')?.querySelector('[data-ui-select-trigger]');
const journalWorkplaceOptions = JSON.parse(journalWorkplaceTrigger?.dataset.options || '[]');
const journalAggregateOption = journalWorkplaceOptions.find((item) => item.value === '__all__');
const journalStudioOption = journalWorkplaceOptions.find((item) => item.value === 'runtime-studio');
ok(journalAggregateOption?.label === 'График дня' && String(journalAggregateOption?.meta || '').includes('1'),
  'Journal aggregate selector must be Graph day with total record count');
ok(String(journalStudioOption?.meta || '').includes('09:00 - 18:00') && String(journalStudioOption?.meta || '').includes('1'),
  'Journal workplace selector must show work range and record count');
ok(Boolean(journalStudioOption?.indicatorColor),
  'Journal workplace selector must carry workplace indicator color');
journalWorkplaceModal?.v2Close?.();
await wait(25);

mark('journal-day-z-report');
shell()?.querySelector('[data-v2-workspace-a]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(30);
journalSettings = document.querySelector('[data-shared-profile-settings-menu]');
journalSettings?.querySelector('[data-shared-profile-action="z-report"]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(40);
let journalZReport = document.querySelector('[data-modal][data-v2-layer-kind="top"]');
const journalReceipt = journalZReport?.querySelector('[data-read-only-sheet]');
ok(Boolean(journalReceipt), 'Journal Z-report must use shared read-only receipt');
ok(journalReceipt?.querySelector('.read-only-sheet__header h2')?.textContent.trim() === 'Z - Отчет',
  'Journal Z-report receipt title missing');
ok(journalReceipt?.textContent.includes('Студия Тест') && journalReceipt?.textContent.includes('Кол-во записей:'),
  'Journal Z-report summary rows missing');
ok(journalReceipt?.textContent.includes('UEI-JOURNAL') && journalReceipt?.textContent.includes('к оплате'),
  'Journal Z-report record/status rows missing');
journalZReport?.v2Close?.();
await wait(25);

mark('journal-day-record-open');
const journalRecord = shell()?.querySelector('[data-journal-usage="runtime-journal-record"]');
ok(Boolean(journalRecord), 'Journal Day record plaque missing');
journalRecord?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(60);
let recordZ = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(Boolean(recordZ?.classList.contains('record-view-z')), 'Journal record did not open Record Z2');
ok(Boolean(recordZ?.querySelector('.record-confirmation-mini-card')), 'Record Z2 must use canonical mini-card');
ok(!recordZ?.querySelector('.entity-card--top-dark'), 'Record Z2 must not keep legacy dark entity card');
const recordReceipt = recordZ?.querySelector('[data-read-only-sheet]');
ok(Boolean(recordReceipt), 'Record Z2 procedures must use shared read-only receipt');
ok(recordReceipt?.textContent.includes(runtimeProcedure.name),
  'Record Z2 must show full procedure name');
ok(!document.querySelector('[data-record-payment-entry]'),
  'Opening Record must not create legacy automatic payment sheet');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.includes('К оплате'),
  'Record Z2 C must expose amount due');

mark('journal-record-settings');
shell()?.querySelector('[data-v2-workspace-a]')?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(35);
const recordSettings = document.querySelector('[data-shared-profile-settings-menu]');
const recordActionIds = [...(recordSettings?.querySelectorAll('[data-shared-profile-action]') || [])]
  .map((node) => node.dataset.sharedProfileAction);
ok(recordActionIds.join('|') === 'move|cancel|delete',
  'Record A must contain exactly Move, Cancel and Delete');
recordSettings?.closest('[data-modal]')?.v2Close?.();
await wait(20);

mark('journal-record-payment');
shell()?.querySelector('[data-v2-workspace-primary]')
  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(50);
let paymentZ = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);
ok(paymentZ?.querySelector('[data-workspace-header-context]')?.dataset.workspaceTitle === 'Оплата',
  'Record C must open Payment Z3');
ok(Boolean(paymentZ?.querySelector('[data-payment-ui]')), 'Payment Z3 shared form missing');
ok(Boolean(paymentZ?.querySelector('[data-payment-price]')), 'Payment Z3 editable procedure price missing');
ok(Boolean(paymentZ?.querySelector('input[data-payment-discount-percent]')), 'Payment Z3 percent discount selector missing');
ok(Boolean(paymentZ?.querySelector('[data-payment-discount-money]')), 'Payment Z3 money discount field missing');
ok(shell()?.querySelector('[data-v2-workspace-primary]')?.textContent.trim() === 'Оплатить',
  'Payment Z3 C must be Pay when data is unchanged');
mark('journal-record-payment-close');
paymentZ?.v2Close?.();
await wait(25);
recordZ?.v2Close?.();
await wait(35);

await openF(4,'journal-day');
await tapAndOpen(fDeck(), fCard('journal'), 17, 'journal-again');
ok(shell()?.classList.contains('is-e-open'), 'Journal did not reopen E after Day');
await tapAndOpen(eDeck(), eCard('list'), 18, 'journal-list');
ok(!shell()?.classList.contains('is-deck-open'), 'Journal List selection did not enter Z');

await openF(5,'journal-list');
await tapAndOpen(fDeck(), fCard('profile'), 19, 'profile');
ok(!shell()?.classList.contains('is-deck-open'), 'Profile F without E did not enter Z directly');

// Repeat full roots to expose stale listeners/rAF from persistent shell reuse.
for (const [index,id] of ['people','finance','journal','profile','settings','people'].entries()) {
  await openF(20 + index, 'repeat-' + id);
  await tapAndOpen(fDeck(), fCard(id), 40 + index, 'repeat-' + id);
  if (id === 'finance' || id === 'journal' || id === 'settings') {
    ok(shell()?.classList.contains('is-e-open'), id + ' repeat did not enter E');
    // Collapse E by its own geometry before continuing to avoid choosing an arbitrary child.
    const deck = eDeck();
    pointer(deck,'pointerdown',190,390,70 + index);
    pointer(deck,'pointermove',232,392,70 + index);
    pointer(deck,'pointerup',232,392,70 + index);
    await wait(140);
    ok(!shell()?.classList.contains('is-e-open'), id + ' E did not collapse by right gesture');
    // F is still open; choose a root without E to return to Z deterministically.
    await tapAndOpen(fDeck(), fCard('people'), 90 + index, id + '-to-people');
  }
}

mark('finalize');
if (failures.length) {
  document.documentElement.dataset.professionalRuntime = 'fail';
  result.textContent = failures.join('\n');
} else {
  document.documentElement.dataset.professionalRuntime = 'pass';
  result.textContent = 'real professional core runtime passed';
}
</script>
</body>
</html>
