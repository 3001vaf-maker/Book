<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/buttons/buttons.css">
  <link rel="stylesheet" href="/ui/settings/settings.css">
  <link rel="stylesheet" href="/ui/modals/modal.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<div id="host"></div>
<script type="module">
import { button, modal, mountModal, openSharedProfileSettingsMenu, v2Header, v2Shell } from '/ui/ui.js';
import { hydrateWorkplacesFromServer } from '/core/profile/workplaces/data.js';
import { openServiceWorkplaceSelection } from '/core/service/workplace-selection.js';
import { openJournalWorkplaceControl } from '/journal/workplace-control.js';

hydrateWorkplacesFromServer([{ key: 'test-space', name: 'Тестовое пространство' }]);
let selection = [];
let headerACount = 0;
let headerCCount = 0;
const host = document.querySelector('#host');
const header = v2Header({
  a: { kind: 'settings', aria: 'A', data: 'data-test-header-a' },
  b: 'Проверка modal',
  c: { label: 'C', aria: 'C', data: 'data-test-header-c' },
});
host.innerHTML = v2Shell({
  header,
  body: button('Настройки', { data: 'data-test-settings' })
    + button('Журнал: пространство', { data: 'data-test-journal-workplace' })
    + button('Открыть Q', { data: 'data-test-open-q' })
    + '<output data-test-selection>0</output><output data-test-journal-selection>__all__</output>'
    + '<output data-test-header-a-count>0</output><output data-test-header-c-count>0</output>',
});

host.querySelector('[data-test-header-a]').addEventListener('click', () => {
  headerACount += 1;
  host.querySelector('[data-test-header-a-count]').textContent = String(headerACount);
});
host.querySelector('[data-test-header-c]').addEventListener('click', () => {
  headerCCount += 1;
  host.querySelector('[data-test-header-c-count]').textContent = String(headerCCount);
});
host.querySelector('[data-test-open-q]').addEventListener('click', () => {
  mountModal(host, modal(button('Q content', { data: 'data-test-q-content' }), {
    variant: 'q',
    title: 'Q',
  }));
});

host.querySelector('[data-test-journal-workplace]').addEventListener('click', () => {
  const output = host.querySelector('[data-test-journal-selection]');
  openJournalWorkplaceControl({
    workplaces: [{ key: 'beauty', name: 'Beauty Day', from: '10:00', to: '20:00' }],
    workplaceId: output.textContent || '__all__',
    aggregateCount: 2,
    recordCounts: { beauty: 1 },
    onSelect: (next) => { output.textContent = next; },
  });
});

host.querySelector('[data-test-settings]').addEventListener('click', () => {
  openSharedProfileSettingsMenu({ actions: [{
    id: 'workplaces', label: 'Рабочие пространства',
    onSelect: () => openServiceWorkplaceSelection({
      selected: selection,
      onChange: (next) => {
        selection = next;
        host.querySelector('[data-test-selection]').textContent = String(next.length);
      },
    }),
  }] });
});

// Layout matrix uses the real shared variants. It never disables hit testing.
const variant = new URLSearchParams(location.search).get('variant');
if (variant !== null) {
  const kind = variant === 's' ? 's' : 'x';
  const className = kind === 's' || !variant ? '' : `modal--${variant}-sheet`;
  mountModal(host, modal(button('Проверка нажатия', { data: 'data-test-target' }), {
    variant: kind, className, title: 'Проверка',
  }));
}
document.documentElement.dataset.modalTestReady = 'true';
</script>
</body>
</html>
