<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/lists/list-entry.css">
</head>
<body>
  <div id="host"></div>
  <output data-opened></output>
  <output data-order></output>
<script type="module">
import { initV2ListReorder, v2ListEntries, v2ListEntry } from '/ui/ui.js';

const host = document.querySelector('#host');
const items = [
  { id:'one', title:'Первая процедура' },
  { id:'two', title:'Вторая процедура' },
  { id:'three', title:'Третья процедура' },
];
host.innerHTML = v2ListEntries(items.map((item) => v2ListEntry({
  title:item.title,
  interactive:true,
  data:`data-procedure="${item.id}" data-reorder-id="${item.id}"`,
})));

host.querySelectorAll('[data-procedure]').forEach((node) => {
  node.addEventListener('click', () => {
    document.querySelector('[data-opened]').textContent = node.dataset.procedure;
  });
});

initV2ListReorder(host, {
  holdMs: 260,
  onReorder: (ids) => {
    document.querySelector('[data-order]').textContent = ids.join(',');
  },
});

document.documentElement.dataset.listReorderReady = 'true';
</script>
</body>
</html>
