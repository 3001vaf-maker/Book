<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--surface-dark:#2f3338;--button-secondary:#d8d3cf;--text-muted:#817a73;--app-max-width:390px;--visual-vh:780px}
    html,body{margin:0;width:390px;height:780px}
    *{box-sizing:border-box}
  </style>
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<div id="host"></div>
<pre id="result">pending</pre>
<script type="module">
import {
  v2CardDeck,
  v2Shell,
  v2ZLayer,
  mountV2ZLayer,
  initV2WorkspaceInteraction,
  initV2StickerSwipe,
  v2Sticker,
  setV2DeckOpen,
} from '/ui/v2/index.js';

const result = document.querySelector('#result');
const failures = [];
let stageName = 'boot';
const mark = (name) => {
  stageName = name;
  result.textContent = 'running: ' + name;
  document.documentElement.dataset.fezRuntimeStage = name;
};
const ok = (condition, message) => { if (!condition) failures.push(stageName + ': ' + message); };
const nextFrame = () => new Promise((resolve) => window.setTimeout(resolve, 70));
window.addEventListener('unhandledrejection', (event) => {
  failures.push(stageName + ': unhandled rejection: ' + String(event.reason?.message || event.reason || 'unknown'));
});
const pointer = (target, type, x, y, id = 1) => {
  target.dispatchEvent(new PointerEvent(type, {
    bubbles:true, cancelable:true, pointerId:id, pointerType:'touch',
    clientX:x, clientY:y, button:0,
  }));
};
const click = (target, x = 180, y = 380) => {
  pointer(target, 'pointerdown', x, y, 9);
  pointer(target, 'pointerup', x, y, 9);
  target.dispatchEvent(new MouseEvent('click', { bubbles:true, cancelable:true, clientX:x, clientY:y }));
};

for (const name of ['setPointerCapture','releasePointerCapture']) {
  Object.defineProperty(Element.prototype, name, { configurable:true, value(){ } });
}
Object.defineProperty(Element.prototype, 'hasPointerCapture', { configurable:true, value(){ return true; } });
window.addEventListener('error', (event) => failures.push(stageName + ': window error: ' + (event.error?.message || event.message)));

const roots = [
  { id:'one', label:'Один' },
  { id:'two', label:'Два' },
  { id:'three', label:'Три' },
];
const children = [
  { id:'a', label:'A' },
  { id:'b', label:'B' },
  { id:'c', label:'C' },
];
const host = document.querySelector('#host');
host.innerHTML = v2Shell({
  deck:v2CardDeck(roots, { axis:'x', active:'one', level:'f' }),
  eDeck:v2CardDeck(children, { axis:'y', active:'a', level:'e' }),
  body:'<div style="height:1200px"><div class="v2-rail" style="display:flex;overflow-x:auto;width:100%"><div style="min-width:700px;height:40px">rail</div></div></div>',
  className:'v2-app--runtime-test',
});
const app = host.querySelector('[data-v2-app]');
const z = app.querySelector('[data-v2-z]');
const edge = app.querySelector('[data-v2-edge-swipe]');

ok(Boolean(edge), 'missing dedicated edge owner');
ok(getComputedStyle(z).touchAction === 'auto', 'Z must keep native inner pan-x/pan-y');
ok(Math.round(edge.getBoundingClientRect().width) === 36, 'edge owner must be 36px');
ok(getComputedStyle(edge).touchAction === 'none', 'edge owner must exclusively own its gesture');
ok(getComputedStyle(edge).pointerEvents === 'none', 'unused edge owner must not block Z content');

mark('bind-z-disabled');
const disposeNoZ = initV2WorkspaceInteraction(app, { activeId:'one', deckOpen:false, bindZ:false });
await nextFrame();
ok(getComputedStyle(edge).pointerEvents === 'none', 'bindZ:false activated a dead edge strip');
disposeNoZ();

mark('closed-semantic-active');
const hiddenF = app.querySelector('[data-v2-card-deck][data-v2-deck-level="f"]');
hiddenF.scrollLeft = hiddenF.scrollWidth;
let firstOwnerCalls = 0;
let dispose = initV2WorkspaceInteraction(app, {
  activeId:'one',
  deckOpen:false,
  onRootSelect:() => { firstOwnerCalls += 1; },
});
await nextFrame();
ok(app.querySelector('[data-v2-card-item="one"]').classList.contains('is-active'), 'closed F overwrote semantic activeId from stale scroll position');
ok(getComputedStyle(edge).pointerEvents === 'auto', 'bound edge owner must become interactive');

mark('external-f-owner-sync');
setV2DeckOpen(app, true);
await nextFrame();
ok(getComputedStyle(edge).pointerEvents === 'none', 'open F must disable the Z edge hit area');
const externalNeighbour = app.querySelector('[data-v2-card-item="two"]');
click(externalNeighbour);
await nextFrame();
ok(firstOwnerCalls === 1, 'F interaction owner did not follow externally opened deck state');
const frontWhileFOpen = app.querySelector('[data-v2-front]');
pointer(edge, 'pointerdown', 12, 300, 41);
pointer(edge, 'pointermove', 48, 302, 41);
pointer(edge, 'pointerup', 48, 302, 41);
await nextFrame();
ok(!frontWhileFOpen.classList.contains('is-dragging'), 'Z started dragging while F was already open');
ok(frontWhileFOpen.style.getPropertyValue('--v2-front-drag-x') === '', 'Z moved while F owned navigation interaction');
setV2DeckOpen(app, false);
firstOwnerCalls = 0;
await nextFrame();

mark('root-z-to-f');
pointer(edge, 'pointerdown', 12, 300, 1);
pointer(edge, 'pointermove', 46, 302, 1);
pointer(edge, 'pointerup', 46, 302, 1);
await nextFrame();
ok(app.classList.contains('is-deck-open'), 'edge swipe did not open F');

mark('active-f-tap');
const active = app.querySelector('[data-v2-card-item].is-active');
click(active);
await nextFrame();
ok(firstOwnerCalls === 1, 'active F tap must fire exactly once');

// A clean tap on a neighbouring card is also an immediate action.
// No extra "centre first, tap again" state is allowed.
const neighbour = app.querySelector('[data-v2-card-item="two"]');
click(neighbour);
await nextFrame();
ok(firstOwnerCalls === 2, 'non-active clean F tap did not fire exactly once');

mark('owner-rebind');
dispose();
let secondOwnerCalls = 0;
dispose = initV2WorkspaceInteraction(app, {
  activeId:'one',
  deckOpen:true,
  onRootSelect:() => { secondOwnerCalls += 1; },
});
await nextFrame();

const reboundActive = app.querySelector('[data-v2-card-item].is-active');
click(reboundActive);
await nextFrame();
ok(firstOwnerCalls === 2 && secondOwnerCalls === 1, 'disposed FEZ owner remained active after rebind');

mark('f-native-scroll');
// Real browser layout + scroll must drive the active card and continuous 3D variables.
const fDeck = app.querySelector('[data-v2-card-deck][data-v2-deck-level="f"]');
const fCards = [...fDeck.querySelectorAll('[data-v2-card-item]')];
const secondFLeft = fCards[1].offsetLeft - (fDeck.clientWidth - fCards[1].offsetWidth) / 2;
fDeck.scrollLeft = Math.max(0, secondFLeft);
fDeck.dispatchEvent(new Event('scroll'));
await new Promise((resolve) => setTimeout(resolve, 140));
await nextFrame();
ok(fCards[1].classList.contains('is-active'), 'native F scroll did not update the centred active card');
ok(Number.parseFloat(fCards[0].style.getPropertyValue('--v2-card-depth')) < 0, 'neighboring F card did not move into Z-depth');
ok(Math.abs(Number.parseFloat(fCards[0].style.getPropertyValue('--v2-card-rotation'))) > 0, 'neighboring F card did not bend in 3D');

pointer(reboundActive, 'pointerdown', 180, 380, 12);
pointer(reboundActive, 'pointermove', 220, 382, 12);
pointer(reboundActive, 'pointerup', 220, 382, 12);
reboundActive.dispatchEvent(new MouseEvent('click', { bubbles:true, cancelable:true, clientX:220, clientY:382 }));
await nextFrame();
ok(secondOwnerCalls === 1, 'drag leaked into click navigation');
ok(getComputedStyle(reboundActive).scrollSnapStop !== 'always', 'CardDeck still forces a stop on every card');

mark('e-native-scroll');
dispose();
dispose = initV2WorkspaceInteraction(app, {
  activeId:'two',
  eActiveId:'a',
  deckOpen:true,
  eOpen:true,
});
await nextFrame();
const liveFCard = app.querySelector('[data-v2-card-deck][data-v2-deck-level="f"] [data-v2-card-item]');
const eDeck = app.querySelector('[data-v2-card-deck][data-v2-deck-level="e"]');
const eCards = [...eDeck.querySelectorAll('[data-v2-card-item]')];
ok(liveFCard.offsetWidth === eCards[0].offsetWidth, 'E card base width differs from F card width');
ok(liveFCard.offsetHeight === eCards[0].offsetHeight, 'E card base height differs from F card height');
const secondETop = eCards[1].offsetTop - (eDeck.clientHeight - eCards[1].offsetHeight) / 2;
eDeck.scrollTop = Math.max(0, secondETop);
eDeck.dispatchEvent(new Event('scroll'));
await new Promise((resolve) => setTimeout(resolve, 140));
await nextFrame();
ok(eCards[1].classList.contains('is-active'), 'native E scroll did not update the centred active card');
ok(Math.abs(Number.parseFloat(eCards[0].style.getPropertyValue('--v2-card-rotation'))) > 0, 'neighboring E card did not bend in 3D');
const rootBeforeBackgroundScroll = app.querySelector('[data-v2-card-deck][data-v2-deck-level="f"] [data-v2-card-item].is-active')?.dataset.v2CardItem;
const backgroundF = app.querySelector('[data-v2-card-deck][data-v2-deck-level="f"]');
backgroundF.scrollLeft = backgroundF.scrollWidth;
backgroundF.dispatchEvent(new Event('scroll'));
await nextFrame();
ok(app.querySelector('[data-v2-card-deck][data-v2-deck-level="f"] [data-v2-card-item].is-active')?.dataset.v2CardItem === rootBeforeBackgroundScroll, 'background F changed active root while E was open');
mark('e-collapse');
pointer(eDeck, 'pointerdown', 180, 390, 16);
pointer(eDeck, 'pointermove', 220, 392, 16);
pointer(eDeck, 'pointerup', 220, 392, 16);
await nextFrame();
ok(!app.classList.contains('is-e-open'), 'E right-swipe from its middle did not collapse back to F');
ok(Number.parseFloat(eDeck.style.getPropertyValue('--v2-e-dismiss-x')) >= app.querySelector('.v2-app__stage').clientWidth, 'E collapse snapped back instead of continuing right from the finger');

mark('z2-edge-close');
setV2DeckOpen(app, false);
const layer = mountV2ZLayer(app, v2ZLayer('<p>Z2</p>', { className:'runtime-z2' }), { stack:true });
ok(Boolean(layer?.isConnected), 'Z2 did not mount');
pointer(edge, 'pointerdown', 10, 260, 20);
pointer(edge, 'pointermove', 44, 261, 20);
pointer(edge, 'pointerup', 44, 261, 20);
await nextFrame();
ok(!layer?.isConnected, 'edge swipe did not close top Z2');

mark('z-layer-replacement');
const oldLayer = mountV2ZLayer(app, v2ZLayer('<p>old</p>', { className:'runtime-old' }), { stack:true });
let oldDisposed = 0;
const oldDispose = oldLayer.v2Dispose;
oldLayer.v2Dispose = () => { oldDisposed += 1; oldDispose(); };
const replacement = mountV2ZLayer(app, v2ZLayer('<p>new</p>', { className:'runtime-new' }), { stack:false });
await nextFrame();
ok(oldDisposed === 1 && !oldLayer.isConnected && replacement?.isConnected, 'non-stack Z replacement skipped disposal');
replacement?.v2Close?.();

mark('generic-base-z');
// Generic base-Z owner (used by booking/auth/chat) must move the whole front with the finger.
const genericHost = document.createElement('div');
genericHost.innerHTML = v2Shell({ body:'<p>generic Z</p>', className:'v2-app--generic-runtime' });
document.body.appendChild(genericHost);
const genericApp = genericHost.querySelector('[data-v2-app]');
const genericEdge = genericApp.querySelector('[data-v2-edge-swipe]');
const genericFront = genericApp.querySelector('[data-v2-front]');
let genericBack = 0;
const disposeGeneric = (await import('/ui/v2/index.js')).initV2Swipe(genericApp.querySelector('[data-v2-z]'), {
  onRight:() => { genericBack += 1; },
  revealDeck:false,
  threshold:28,
});
pointer(genericEdge, 'pointerdown', 10, 220, 25);
pointer(genericEdge, 'pointermove', 44, 222, 25);
ok(genericFront.classList.contains('is-dragging'), 'generic Z1 did not enter physical drag state');
ok(genericFront.style.getPropertyValue('--v2-front-drag-x') !== '', 'generic Z1 did not move the shared front');
pointer(genericEdge, 'pointerup', 44, 222, 25);
await nextFrame();
ok(genericBack === 1, 'generic Z1 edge swipe callback did not fire');
disposeGeneric();
genericHost.remove();

mark('sticker-swipe');
const stickerHost = document.createElement('div');
stickerHost.innerHTML = v2Sticker({ title:'Тест', body:'Тело' });
document.body.appendChild(stickerHost);
let stickerRight = 0;
const disposeSticker = initV2StickerSwipe(stickerHost, { onRight:() => { stickerRight += 1; }, threshold:20 });
const stickerSurface = stickerHost.querySelector('[data-v2-sticker]');
pointer(stickerSurface, 'pointerdown', 40, 600, 30);
pointer(stickerSurface, 'pointermove', 80, 602, 30);
pointer(stickerSurface, 'pointerup', 80, 602, 30);
await nextFrame();
ok(stickerRight === 1, 'sticker swipe runtime failed');
disposeSticker();
dispose();
await nextFrame();
ok(getComputedStyle(edge).pointerEvents === 'none', 'edge owner stayed interactive after all owners disposed');

mark('finalize');
if (failures.length) {
  document.documentElement.dataset.fezRuntime = 'fail';
  result.textContent = failures.join('\n');
} else {
  document.documentElement.dataset.fezRuntime = 'pass';
  result.textContent = 'FEZ runtime browser test passed';
}
</script>
</body>
</html>
