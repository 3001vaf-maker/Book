services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: book
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book
    ports:
      - "5432:5432"
    volumes:
      - book-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d book"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  book-postgres:
