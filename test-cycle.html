<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book — проверка исправления UI</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f5f5f3;color:#111}
    .test-bar{position:sticky;top:0;z-index:9999;padding:10px 14px;background:#111;color:#fff;font-size:14px}
    .test-bar strong{display:block;margin-bottom:4px}
    .test-bar button{margin:4px 4px 0 0;padding:8px 10px;border:0;border-radius:7px;cursor:pointer}
    #app{min-height:100vh}
    #test-error{display:none;margin:12px;padding:14px;border-radius:10px;background:#ffe5e5;color:#8b0000;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="test-bar">
    <strong>ТЕСТ Book — исправление циклической зависимости UI</strong>
    <span>Ниже открывается настоящее приложение из проверяемой версии. Эта панель нужна только для проверки.</span>
    <div>
      <button type="button" onclick="location.reload()">Перезагрузить</button>
      <button type="button" onclick="document.getElementById('test-error').style.display='none'">Скрыть ошибку</button>
    </div>
  </div>
  <div id="test-error"></div>
  <div id="app" class="app-shell"></div>
  <script>
    window.addEventListener('error', event => {
      const box=document.getElementById('test-error');
      box.style.display='block';
      box.textContent='ОШИБКА:\n'+(event.error?.stack || event.message || 'Неизвестная ошибка');
    });
    window.addEventListener('unhandledrejection', event => {
      const box=document.getElementById('test-error');
      box.style.display='block';
      box.textContent='ОШИБКА:\n'+(event.reason?.stack || event.reason || 'Неизвестная ошибка');
    });
  </script>
  <script type="module" src="https://raw.githubusercontent.com/3001vaf-maker/Book/audit-ui-cycle-fix/core.js"></script>
</body>
</html>
