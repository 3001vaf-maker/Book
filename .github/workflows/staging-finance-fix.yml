name: One-shot staging finance fix

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-finance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Apply targeted finance regression fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          business = Path('server/src/business-state/business-state.service.ts')
          source = business.read_text()
          old = "payment: { state: paid > 0 ? (due <= 0.009 ? 'paid' : 'partial') : 'unpaid', paid, due },"
          new = "payment: { state: due <= 0.009 ? 'paid' : paid > 0 ? 'partial' : 'unpaid', paid, due },"
          assert old in source
          business.write_text(source.replace(old, new, 1))

          booking = Path('server/src/online-booking/online-booking.service.ts')
          source = booking.read_text()
          old = "payment: { state: 'unpaid', paid: 0, due: total },"
          new = "payment: { state: total <= 0.009 ? 'paid' : 'unpaid', paid: 0, due: total },"
          assert old in source
          booking.write_text(source.replace(old, new, 1))

          test = Path('tests/booking-server-autonomy.test.mjs')
          source = test.read_text()
          anchor = "assert.match(documentState, /source: 'online-booking-account'/);\n"
          extra = """assert.match(service, /payment:\\s*\\{\\s*state:\\s*total <= 0\\.009 \\? 'paid' : 'unpaid', paid: 0, due: total \\}/s, 'Zero-due booking starts settled without a money operation');\nassert.match(business, /payment:\\s*\\{\\s*state:\\s*due <= 0\\.009 \\? 'paid' : paid > 0 \\? 'partial' : 'unpaid', paid, due \\}/s, 'Live zero-due snapshot remains settled');\n"""
          assert anchor in source
          test.write_text(source.replace(anchor, anchor + extra, 1))
          PY
          rm .github/workflows/staging-finance-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/business-state/business-state.service.ts server/src/online-booking/online-booking.service.ts tests/booking-server-autonomy.test.mjs .github/workflows/staging-finance-fix.yml
          git commit -m "Settle zero-due booking finance"
          git push origin HEAD:staging
