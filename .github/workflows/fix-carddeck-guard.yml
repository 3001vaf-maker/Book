name: Align CardDeck guard

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Update stale CardDeck contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-ui-v2-architecture.mjs')
          s = p.read_text()
          old = "expect(ui.includes('.slice(0, 7)') && ui.includes('data-v2-card-index=\"${index}\"') && ui.includes('data-v2-deck-level=\"${text(level)}\"'), 'Shared CardDeck must keep peer cards with explicit F/E level data and no visual F1/F2/F3 hierarchy.');"
          new = "expect(ui.includes('data-v2-card-index=\"${index}\"') && ui.includes('data-v2-deck-level=\"${text(level)}\"'), 'Shared CardDeck must keep all real peer cards with explicit F/E level data and no visual F1/F2/F3 hierarchy.');"
          if old not in s:
              raise SystemExit('stale CardDeck seven-card guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-carddeck-guard.yml
          git diff --check
      - name: Commit corrected architecture contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow complete Shared CardDeck root navigation"
          git push origin HEAD:staging
