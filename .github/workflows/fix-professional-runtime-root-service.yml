name: Correct professional Service runtime scenario

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Align browser scenario with standalone Service F
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/professional-core-runtime-browser.html')
          s = p.read_text()
          old = """mark('service-z2-procedure');
          await openF(6,'service');
          await tapAndOpen(fDeck(), fCard('settings'), 20, 'settings-service-root');
          ok(shell()?.classList.contains('is-e-open'), 'Settings did not open E for Service');
          await tapAndOpen(eDeck(), eCard('service'), 21, 'settings-service');
          await wait(120);"""
          new = """mark('service-z2-procedure');
          await openF(6,'service');
          await tapAndOpen(fDeck(), fCard('service'), 20, 'service-root');
          ok(!shell()?.classList.contains('is-deck-open'), 'Service standalone F did not enter Z directly');
          ok(!shell()?.classList.contains('is-e-open'), 'Service standalone F must not open Settings E');
          await wait(120);"""
          if old not in s:
              raise SystemExit('stale Settings -> Service browser scenario was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-professional-runtime-root-service.yml
          git diff --check
      - name: Commit browser contract correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Test Service as standalone professional root F"
          git push origin HEAD:staging
