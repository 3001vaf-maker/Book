name: One-time Finance roundtrip contract cleanup

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-finance-roundtrip-contract-test.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Remove legacy discount vocabulary from Finance roundtrip regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/finance-roundtrip-alignment.test.mjs')
          s = p.read_text()
          replacements = {
            'discountMode': 'correctionMode',
            'discountPercent': 'correctionPercent',
            'discountMoney': 'correctionMoney',
            'discountTotal': 'correctionTotal',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected legacy Finance test token not found: {old}')
              s = s.replace(old, new)
          for old in replacements:
              if old in s:
                  raise SystemExit(f'Legacy Finance test token still remains: {old}')
          p.write_text(s)
          PY
      - name: Verify Finance roundtrip regression
        run: node tests/finance-roundtrip-alignment.test.mjs
      - name: Commit regression contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3001vaf-maker'
          git config user.email '30.01vaf@gmail.com'
          git add tests/finance-roundtrip-alignment.test.mjs
          git diff --cached --check
          git commit -m 'Align Finance roundtrip test with price correction contract'
          git push origin HEAD:staging

# one-time migration trigger
