name: Apply FE fix
on:
  push:
    branches:
      - staging
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core.js')
          s = p.read_text()
          a = """    if (nextEIds !== currentEIds) {
      currentE?.remove();
      if (eDeck && feHost) feHost.insertAdjacentHTML('beforeend', eDeck);
    }

    setV2DeckOpen(shell, state.navigationOpen);"""
          b = """    if (nextEIds !== currentEIds && feHost) {
      feHost.innerHTML = rootDeck + eDeck;
    }
    shell.classList.toggle('has-e-deck', Boolean(eDeck));

    setV2DeckOpen(shell, state.navigationOpen);"""
          if a not in s:
              raise SystemExit('FE block not found')
          p.write_text(s.replace(a, b, 1))
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fe-deck-fix.yml .github/workflows/diagnose-professional-settings.yml
          git add core.js
          git commit -m "Keep F and E navigation topology atomic"
          git push origin HEAD:staging
