name: Apply FE deck fix

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Make F and E topology update atomic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core.js')
          text = path.read_text()
          old = """    if (nextEIds !== currentEIds) {
      currentE?.remove();
      if (eDeck && feHost) feHost.insertAdjacentHTML('beforeend', eDeck);
    }

    setV2DeckOpen(shell, state.navigationOpen);"""
          new = """    if (nextEIds !== currentEIds && feHost) {
      feHost.innerHTML = `${rootDeck}${eDeck}`;
    }
    shell.classList.toggle('has-e-deck', Boolean(eDeck));

    setV2DeckOpen(shell, state.navigationOpen);"""
          if old not in text:
              raise SystemExit('FE topology block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fe-deck-fix.yml .github/workflows/diagnose-professional-settings.yml
          git add core.js
          git commit -m "Keep F and E navigation topology atomic"
          git push origin HEAD:staging
