name: Apply contact browser regression contract

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-contact-browser-contract.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Update browser regression contract
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git diff --check
      - name: Commit browser contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/account-shell-runtime-browser.html
          git commit -m "Update professional contact browser regression"
          git push origin HEAD:staging
