name: Fix contact browser test syntax

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-contact-browser-test.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Fix test syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/account-shell-runtime-browser.html')
          s = p.read_text()
          fixes = {
            "ok(Boolean(contactZ)\", 'Professional contact profile must open as stacked Z');": "ok(Boolean(contactZ), 'Professional contact profile must open as stacked Z');",
            "'Investor Z must expose ROIÙ'": "'Investor Z must expose ROI'",
            "ok(investmentZ?.textContent.includes('Вложение')), 'Linked investor history must mirror project contribution');": "ok(investmentZ?.textContent.includes('Вложение'), 'Linked investor history must mirror project contribution');",
            "ok(investmentZ?.textContent.includes('Доход')), 'Linked investor history must mirror paid income');": "ok(investmentZ?.textContent.includes('Доход'), 'Linked investor history must mirror paid income');",
            "ok(investmentZ?.textContent.includes('Изменение оценки')), 'Linked investor history must include non-cash valuation');": "ok(investmentZ?.textContent.includes('Изменение оценки'), 'Linked investor history must include non-cash valuation');",
          }
          for old, new in fixes.items():
            if old not in s:
              raise SystemExit('Expected broken test fragment not found: ' + old)
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/account-shell-runtime-browser.html
          git commit -m "Fix professional contact browser regression syntax"
          git push origin HEAD:staging
