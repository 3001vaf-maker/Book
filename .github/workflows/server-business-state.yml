name: Server Business State Migration

on:
  push:
    branches: [feat/server-business-state]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/server-business-state
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply server business-state implementation
        run: |
          python scripts/_apply_server_business_state.py
          python scripts/_fix_server_business_state_arch.py
      - name: Syntax and architecture checks
        run: npm run check
      - name: Domain regression tests
        run: npm test
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Build server
        run: npm run build --prefix server
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/server-business-state.yml scripts/_apply_server_business_state.py scripts/_fix_server_business_state_arch.py server/package-lock.json server/tsconfig.tsbuildinfo
          git config user.name "Book Server Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Move Clients UEI and Record persistence to server"
          git push origin HEAD:feat/server-business-state
