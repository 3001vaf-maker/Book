name: Apply contact profile regression contract

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-contact-profile-contract-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Update regression contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/booking-account-ui.test.mjs')
          source = path.read_text()
          old = """assert.match(contactDetailBlock, /v2Section\\('Рабочие пространства'/);\nassert.match(contactDetailBlock, /v2Section\\('История'/);\n"""
          new = """assert.match(contactDetailBlock, /v2Section\\('Пространства'/);\nconst contactProfileBlock = accountShell.slice(\n  accountShell.indexOf('async function renderGlobalContactDetail'),\n  accountShell.indexOf('async function renderGlobalHistory'),\n);\nassert.doesNotMatch(contactProfileBlock, /v2Section\\('История'/);\nassert.match(contactProfileBlock, /v2Section\\('Программы'/);\nassert.match(contactProfileBlock, /v2Section\\('Инвестиции \\/ займы'/);\nassert.match(contactProfileBlock, /entityCardRail\\(programCards\\)/);\n"""
          if source.count(old) != 1:
              raise SystemExit(f'contact profile contract match count: {source.count(old)}')
          source = source.replace(old, new, 1)
          home_marker = """assert.doesNotMatch(globalHomeBlock, /relationshipCard\\(/);\n"""
          home_new = """assert.doesNotMatch(globalHomeBlock, /relationshipCard\\(/);\nassert.doesNotMatch(globalHomeBlock, /v2Section\\('Инвестиции'/);\nassert.doesNotMatch(globalHomeBlock, /v2Section\\('Предложения инвестиций'/);\n"""
          if source.count(home_marker) != 1:
              raise SystemExit('global home marker not found exactly once')
          source = source.replace(home_marker, home_new, 1)
          path.write_text(source)
          PY
          git diff --check
          git diff -- tests/booking-account-ui.test.mjs
      - name: Commit regression contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/booking-account-ui.test.mjs
          git commit -m "Update end-user contact profile regression contract"
          git push origin HEAD:staging
