name: Fix professional runtime route

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Align Service browser route with root F ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/professional-core-runtime-browser.html')
          text = path.read_text()
          old = """mark('service-z2-procedure');
          await openF(6,'service');
          await tapAndOpen(fDeck(), fCard('settings'), 20, 'settings-service-root');
          ok(shell()?.classList.contains('is-e-open'), 'Settings did not open E for Service');
          await tapAndOpen(eDeck(), eCard('service'), 21, 'settings-service');
          await wait(120);"""
          new = """mark('service-z2-procedure');
          await openF(6,'service');
          await tapAndOpen(fDeck(), fCard('service'), 20, 'service-root');
          ok(!shell()?.classList.contains('is-deck-open'), 'Standalone Service F did not enter Z directly');
          await wait(120);"""
          if old not in text:
              raise SystemExit('stale Service browser route block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git grep -n "eCard('service')\|settings-service-root\|Settings did not open E for Service" -- tests/professional-core-runtime-browser.html && exit 1 || true
      - name: Commit route correction and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-professional-runtime-route.yml
          git add tests/professional-core-runtime-browser.html
          git commit -m "Align professional browser test with standalone Service F"
          git push origin HEAD:staging
