name: One-time payment contract test cleanup

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-payment-ui-contract-test.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Align payment test with canonical price correction contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/payment-ui.test.mjs')
          s = p.read_text()
          replacements = {
            "assert.match(html, /Ручная коррекция %/);": "assert.match(html, /Ручная коррекция цены, %/);",
            "assert.match(html, /Ручная коррекция ₽/);": "assert.match(html, /Ручная коррекция цены, ₽/);",
            "], { discountPercent: 20 });": "], { pricePercent: 20 });",
            "assert.equal(correctedThenAutomatic.discountTotal, 1400);": "assert.equal(correctedThenAutomatic.correctionTotal + correctedThenAutomatic.pricePercentTotal, 1400);",
            "assert.match(paymentSource, /const discountOptions = \\[/);": "assert.match(paymentSource, /const percentOptions = \\[/);",
            "assert.match(paymentSource, /label: 'Ручная коррекция %'/);": "assert.match(paymentSource, /label: 'Ручная коррекция цены, %'/);",
            "assert.match(paymentSource, /label: 'Ручная коррекция ₽'/);": "assert.match(paymentSource, /label: 'Ручная коррекция цены, ₽'/);",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected test contract not found: {old}')
              s = s.replace(old, new)
          if 'discountPercent: 20' in s or 'discountTotal' in s or 'discountOptions' in s or 'Ручная коррекция %' in s or 'Ручная коррекция ₽' in s:
              raise SystemExit('Legacy payment-test contract still remains')
          p.write_text(s)
          PY
      - name: Verify payment regression
        run: node tests/payment-ui.test.mjs
      - name: Commit test contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3001vaf-maker'
          git config user.email '30.01vaf@gmail.com'
          git add tests/payment-ui.test.mjs
          git diff --cached --check
          git commit -m 'Align payment test with price correction contract'
          git push origin HEAD:staging
