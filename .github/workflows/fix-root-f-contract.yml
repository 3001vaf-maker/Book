name: Final standalone F contract fix

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Align UI architecture guard with standalone Profile and Service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-ui-v2-architecture.mjs')
          s = p.read_text()
          replacements = [
            (
              "  ...jsFilesUnder('online-booking'),\n  ...jsFilesUnder('settings'),",
              "  ...jsFilesUnder('online-booking'),\n  ...jsFilesUnder('core/profile'),\n  ...jsFilesUnder('core/service'),\n  ...jsFilesUnder('settings'),",
            ),
            (
              "const workspaceJsFiles = [\n  ...jsFilesUnder('settings'),",
              "const workspaceJsFiles = [\n  ...jsFilesUnder('core/profile'),\n  ...jsFilesUnder('core/service'),\n  ...jsFilesUnder('settings'),",
            ),
            (
              "expect(settings.includes('export function settingsNavigationItems()') && settings.includes('export async function renderSettingsSection(') && settings.includes(\"key !== 'profile'\"), 'Settings E must route existing settings children while Profile stays a root F folder.');",
              "expect(settings.includes('export function settingsNavigationItems()') && settings.includes('export async function renderSettingsSection(') && !settings.includes(\"'profile'\") && !settings.includes(\"'service'\"), 'Settings E must route only Settings-owned children while Profile and Service stay standalone root F folders.');",
            ),
            (
              "\"{ id: 'journal', label: 'Журнал'\", \"{ id: 'profile', label: 'Профиль'\", \"{ id: 'settings', label: 'Настройки'\"",
              "\"{ id: 'journal', label: 'Журнал'\", \"{ id: 'profile', label: 'Профиль'\", \"{ id: 'service', label: 'Сервис'\", \"{ id: 'settings', label: 'Настройки'\"",
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected contract fragment not found: {old[:120]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/fix-root-f-contract.yml
          git diff --check
          git diff --exit-code -- settings/settings.js core/profile core/service || true
      - name: Commit contract correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align UI guard with standalone Profile and Service F ownership"
          git push origin HEAD:staging
