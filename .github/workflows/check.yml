name: Check Book

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and architecture checks
        run: npm run check
      - name: Domain regression tests
        run: npm test
      - name: Validate staging compose
        run: docker compose -f docker-compose.staging.yml config >/dev/null
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Build server
        run: npm run build --prefix server


  profile-migration-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply pre-PROFILE migration chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-migrations
          mv server/prisma/migrations/20260919183000_tenant_invitation_naming /tmp/profile-migrations/
          mv server/prisma/migrations/20260919184000_owner_membership_role /tmp/profile-migrations/
          mv server/prisma/migrations/20260919185000_platform_account_naming /tmp/profile-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Seed representative pre-PROFILE rows
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging <<'SQL'
          INSERT INTO "Tenant" ("id","name","updatedAt")
          VALUES ('upgrade-tenant','Upgrade Tenant',CURRENT_TIMESTAMP);

          INSERT INTO "User" ("id","email","passwordHash","onboardingStep","workspaceUnlocked","updatedAt")
          VALUES ('upgrade-user','upgrade@example.invalid','hash',3,true,CURRENT_TIMESTAMP);

          INSERT INTO "Membership" ("id","tenantId","userId","role")
          VALUES ('upgrade-membership','upgrade-tenant','upgrade-user','OWNER');

          INSERT INTO "WorkspaceState" ("id","tenantId","userId","data","revision","updatedAt")
          VALUES ('upgrade-workspace','upgrade-tenant','upgrade-user','{"kept":true}'::jsonb,7,CURRENT_TIMESTAMP);

          INSERT INTO "Profile" (
            "id","tenantId","userId","name","phones","telegrams","emails","customProfessions","updatedAt"
          )
          VALUES (
            'upgrade-profile','upgrade-tenant','upgrade-user','Upgrade Profile',
            '[]'::jsonb,'[]'::jsonb,'["upgrade@example.invalid"]'::jsonb,'[]'::jsonb,CURRENT_TIMESTAMP
          );

          INSERT INTO "PlatformAdmin" ("id","userId","updatedAt")
          VALUES ('upgrade-admin','upgrade-user',CURRENT_TIMESTAMP);

          INSERT INTO "MasterInvitation" (
            "id","tenantId","createdByAdminId","email","name","tokenHash","status","expiresAt","updatedAt"
          )
          VALUES (
            'upgrade-invitation','upgrade-tenant','upgrade-admin','invite@example.invalid','Invite',
            'upgrade-token-hash','PENDING',CURRENT_TIMESTAMP + INTERVAL '7 days',CURRENT_TIMESTAMP
          );
          SQL
      - name: Apply PROFILE migrations
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/profile-migrations/20260919183000_tenant_invitation_naming server/prisma/migrations/
          mv /tmp/profile-migrations/20260919184000_owner_membership_role server/prisma/migrations/
          mv /tmp/profile-migrations/20260919185000_platform_account_naming server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify PROFILE migration preserves rows and names
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          DO $profile_check$
          BEGIN
            IF (SELECT COUNT(*) FROM "PlatformAccount" WHERE "id" = 'upgrade-user') <> 1 THEN
              RAISE EXCEPTION 'PlatformAccount row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "Membership" WHERE "id" = 'upgrade-membership' AND "platformAccountId" = 'upgrade-user' AND "role"::text = 'OWNER') <> 1 THEN
              RAISE EXCEPTION 'Membership row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" = 'upgrade-workspace' AND "platformAccountId" = 'upgrade-user' AND "revision" = 7) <> 1 THEN
              RAISE EXCEPTION 'WorkspaceState row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" = 'upgrade-profile' AND "platformAccountId" = 'upgrade-user' AND "name" = 'Upgrade Profile') <> 1 THEN
              RAISE EXCEPTION 'Profile row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "PlatformAdmin" WHERE "id" = 'upgrade-admin' AND "platformAccountId" = 'upgrade-user') <> 1 THEN
              RAISE EXCEPTION 'PlatformAdmin row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantInvitation" WHERE "id" = 'upgrade-invitation' AND "tenantId" = 'upgrade-tenant') <> 1 THEN
              RAISE EXCEPTION 'TenantInvitation row was not preserved';
            END IF;
            IF to_regclass('"User"') IS NOT NULL THEN
              RAISE EXCEPTION 'Retired account table still exists';
            END IF;
            IF to_regclass('"MasterInvitation"') IS NOT NULL THEN
              RAISE EXCEPTION 'Retired invitation table still exists';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_enum e
              JOIN pg_type t ON t.oid = e.enumtypid
              WHERE t.typname = 'MembershipRole' AND e.enumlabel <> 'OWNER'
            ) THEN
              RAISE EXCEPTION 'Inactive MembershipRole value still exists';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'PlatformConsentEvent' AND column_name = 'platformAccountId'
            ) THEN
              RAISE EXCEPTION 'PlatformConsentEvent account column was not renamed';
            END IF;
          END
          $profile_check$;
          SQL
      - name: Stop isolated database
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v


  global-account-production-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply pre-global Account migration chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/global-account-migrations
          mv server/prisma/migrations/20260921130000_global_account_identity /tmp/global-account-migrations/
          mv server/prisma/migrations/20260921143000_account_terms /tmp/global-account-migrations/
          mv server/prisma/migrations/20260921150000_account_contact_conflicts /tmp/global-account-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Seed legacy duplicate Account contacts and failed migration marker
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Tenant" ("id","name","updatedAt")
          VALUES
            ('legacy-tenant-a','Legacy A',CURRENT_TIMESTAMP),
            ('legacy-tenant-b','Legacy B',CURRENT_TIMESTAMP);

          INSERT INTO "Account" (
            "id","tenantId","email","passwordHash","name","surname","phone","telegramId",
            "profileData","discountPercent","visits","totalSpent","lastVisit","programs","createdAt","updatedAt"
          )
          VALUES
            (
              'legacy-account-a','legacy-tenant-a','same@example.invalid','hash-a','A','','+79990000001','7770001',
              '{}'::jsonb,0,0,0,'','[]'::jsonb,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
            ),
            (
              'legacy-account-b','legacy-tenant-b','same@example.invalid','hash-b','B','','+79990000001','7770001',
              '{}'::jsonb,0,0,0,'','[]'::jsonb,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
            );

          INSERT INTO "_prisma_migrations" (
            "id","checksum","finished_at","migration_name","logs","rolled_back_at","started_at","applied_steps_count"
          ) VALUES (
            'simulated-failed-global-account',
            'simulated-checksum',
            NULL,
            '20260921130000_global_account_identity',
            'simulated production failure',
            NULL,
            CURRENT_TIMESTAMP,
            0
          );
          SQL
      - name: Verify guarded recovery preflight
        shell: bash
        run: |
          set -uo pipefail
          cd server
          set +e
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' node scripts/recover-global-account-migration.mjs
          recovery_status=$?
          set -e
          if [ "$recovery_status" -ne 42 ]; then
            echo "Expected recovery preflight exit 42, got $recovery_status"
            exit 1
          fi
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate resolve --rolled-back 20260921130000_global_account_identity
      - name: Restore and apply global Account migrations
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/global-account-migrations/20260921130000_global_account_identity server/prisma/migrations/
          mv /tmp/global-account-migrations/20260921143000_account_terms server/prisma/migrations/
          mv /tmp/global-account-migrations/20260921150000_account_contact_conflicts server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify ambiguous contacts are preserved without auto-merge
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          DO $global_account_check$
          BEGIN
            IF (SELECT COUNT(*) FROM "Account" WHERE "id" IN ('legacy-account-a','legacy-account-b')) <> 2 THEN
              RAISE EXCEPTION 'Legacy Accounts were not preserved';
            END IF;

            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'Account' AND column_name = 'tenantId'
            ) THEN
              RAISE EXCEPTION 'Legacy tenantId column still exists on Account';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'Account' AND column_name = 'createdViaTenantId'
            ) THEN
              RAISE EXCEPTION 'createdViaTenantId was not created';
            END IF;

            IF EXISTS (
              SELECT 1 FROM "AccountContact"
              WHERE ("type" = 'EMAIL' AND "value" = 'same@example.invalid')
                 OR ("type" = 'PHONE' AND "value" = '79990000001')
                 OR ("type" = 'TELEGRAM' AND "value" = '7770001')
            ) THEN
              RAISE EXCEPTION 'Ambiguous legacy contact was assigned to one Account';
            END IF;

            IF (SELECT COUNT(*) FROM "AccountContactConflict"
                WHERE ("type" = 'EMAIL' AND "value" = 'same@example.invalid')
                   OR ("type" = 'PHONE' AND "value" = '79990000001')
                   OR ("type" = 'TELEGRAM' AND "value" = '7770001')) <> 3 THEN
              RAISE EXCEPTION 'Legacy contact conflicts were not quarantined';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM "_prisma_migrations"
              WHERE "migration_name" = '20260921130000_global_account_identity'
                AND "finished_at" IS NULL
                AND "rolled_back_at" IS NULL
            ) THEN
              RAISE EXCEPTION 'Failed migration marker remains active';
            END IF;
          END
          $global_account_check$;
          SQL
      - name: Stop isolated database
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v


  staging-smoke:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.base_ref == 'staging' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build staging backend image
        run: docker compose -f docker-compose.staging.yml build backend
      - name: Start isolated database and backend
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          docker compose -f docker-compose.staging.yml up -d backend
      - name: Verify staging backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db backend
          exit 1
      - name: Verify all four production domains
        shell: bash
        run: |
          set -euo pipefail

          expect_status() {
            local host="$1"
            local path="$2"
            local expected="$3"
            local actual
            actual=$(curl -sS -o /tmp/domain-response -w '%{http_code}' -H "Host: $host" "http://localhost:3000$path")
            if [ "$actual" != "$expected" ]; then
              echo "$host$path: expected HTTP $expected, got $actual"
              cat /tmp/domain-response || true
              docker compose -f docker-compose.staging.yml logs backend
              exit 1
            fi
          }

          expect_contains() {
            local host="$1"
            local path="$2"
            local needle="$3"
            local body_file
            body_file=$(mktemp)
            if ! curl -fsS -H "Host: $host" "http://localhost:3000$path" -o "$body_file"; then
              echo "$host$path: request failed"
              docker compose -f docker-compose.staging.yml logs backend
              rm -f "$body_file"
              exit 1
            fi
            if ! grep -Fq "$needle" "$body_file"; then
              echo "$host$path: response does not contain expected marker: $needle"
              cat "$body_file" || true
              docker compose -f docker-compose.staging.yml logs backend
              rm -f "$body_file"
              exit 1
            fi
            rm -f "$body_file"
          }

          expect_status "api.va-tools.ru" "/health" "200"

          expect_status "admin.va-tools.ru" "/" "302"
          expect_status "admin.va-tools.ru" "/admin/" "200"
          expect_status "admin.va-tools.ru" "/admin/admin.js" "200"
          expect_status "admin.va-tools.ru" "/admin/document-registry/view.js" "200"
          expect_status "admin.va-tools.ru" "/admin/document-registry/catalog.js" "200"
          expect_status "admin.va-tools.ru" "/admin/document-registry/history.js" "200"
          expect_contains "admin.va-tools.ru" "/admin/" "Book Admin"
          expect_contains "admin.va-tools.ru" "/admin/" "admin.js?build="
          expect_contains "admin.va-tools.ru" "/admin/admin.js" "document-registry/view.js"
          expect_contains "admin.va-tools.ru" "/admin/document-registry/catalog.js" "privacy-policy"
          expect_contains "admin.va-tools.ru" "/admin/document-registry/view.js" "Реестр документов"

          expect_status "book.va-tools.ru" "/" "200"
          expect_status "book.va-tools.ru" "/core.js" "200"
          expect_contains "book.va-tools.ru" "/" "<title>Book</title>"
          expect_contains "book.va-tools.ru" "/core.js" "app-content"

          expect_status "client.va-tools.ru" "/" "200"
          expect_status "client.va-tools.ru" "/online-booking/booking.js" "200"
          expect_status "client.va-tools.ru" "/online-booking/model.js" "200"
          expect_status "client.va-tools.ru" "/core/time/zone.js" "200"
          expect_contains "client.va-tools.ru" "/" "<title>Book</title>"
          expect_contains "client.va-tools.ru" "/online-booking/booking.js" "renderOnlineBooking"
          expect_contains "client.va-tools.ru" "/online-booking/model.js" "zonedDateTimeParts"
          expect_contains "client.va-tools.ru" "/core/time/zone.js" "Intl.DateTimeFormat"

      - name: Start and verify staging frontend
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml up -d frontend
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core/environment.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/service-worker.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/online-booking/notifications.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core/notifications/web-push.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose -f docker-compose.staging.yml logs frontend backend
              exit 1
            fi
            sleep 2
          done

          owner_password=$(docker compose -f docker-compose.staging.yml exec -T backend printenv OWNER_PASSWORD | tr -d '\r\n')
          login_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({email:'staging@book.local',password:process.argv[1]}))" "$owner_password")" \
            http://localhost:8080/api/auth/login)
          access_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$login_payload")
          tenant_id=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.tenant?.id) process.exit(1); process.stdout.write(p.tenant.id)" "$login_payload")
          curl -fsS -H "Authorization: Bearer $access_token" http://localhost:8080/api/auth/me >/dev/null

          account_terms=$(curl -fsS "http://localhost:8080/api/online-booking/account-terms")
          account_terms_fact=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.key || !p.version) process.exit(1); process.stdout.write(JSON.stringify({key:p.key,version:p.version,accepted:true,acceptedAt:new Date().toISOString()}))" "$account_terms")
          smoke_password="Smoke-${GITHUB_RUN_ID}-Pass"

          booking_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({email:'push-smoke@book.local',password:process.argv[1],name:'Push',phone:'+79990000999',accountTerms:JSON.parse(process.argv[2])}))" "$smoke_password" "$account_terms_fact")" \
            "http://localhost:8080/api/online-booking/$tenant_id/account/register")
          booking_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$booking_payload")

          booking_context=$(curl -fsS "http://localhost:8080/api/online-booking/$tenant_id/context")
          node -e "const p=JSON.parse(process.argv[1]); const w=(p.workplaces||[]).find((item)=>item.key==='studio-test'); if(!w || w.timeZone!=='Europe/Moscow') { console.error('Workplace timezone missing from public booking context'); process.exit(1); }" "$booking_context"

          pdn_consent=$(node -e "const p=JSON.parse(process.argv[1]); const d=(p.documents||[]).find((item)=>item.id==='pdn-consent'); if(!d || !d.version) { console.error('PDN consent missing from public booking context'); process.exit(1); } process.stdout.write(JSON.stringify({documentId:d.id,documentVersion:d.version,accepted:true,acceptedAt:new Date().toISOString()}))" "$booking_context")
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $booking_token" \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({consents:[JSON.parse(process.argv[1])] }))" "$pdn_consent")" \
            "http://localhost:8080/api/online-booking/$tenant_id/account/consents" >/dev/null

          booking_today=$(node -e "const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter((x)=>x.type!=='literal').map((x)=>[x.type,x.value])); process.stdout.write(parts.year+'-'+parts.month+'-'+parts.day)")
          past_body=$(mktemp)
          past_status=$(curl -sS -o "$past_body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $booking_token" \
            -H 'Content-Type: application/json' \
            -d "{\"workplaceKey\":\"studio-test\",\"date\":\"$booking_today\",\"from\":\"00:00\",\"procedureIds\":[\"procedure-cut\"]}" \
            "http://localhost:8080/api/online-booking/$tenant_id/requests")
          if [ "$past_status" != "409" ] || ! grep -Fq "Это время уже прошло" "$past_body"; then
            echo "Public booking past-time guard failed: HTTP $past_status"
            cat "$past_body" || true
            rm -f "$past_body"
            exit 1
          fi
          rm -f "$past_body"

          push_config=$(curl -fsS \
            -H "Authorization: Bearer $booking_token" \
            "http://localhost:8080/api/online-booking/$tenant_id/account/push/config")
          node -e "const p=JSON.parse(process.argv[1]); if(!p.enabled || !p.publicKey) process.exit(1)" "$push_config"

          curl -fsS \
            -X PUT \
            -H "Authorization: Bearer $booking_token" \
            -H 'Content-Type: application/json' \
            -d '{"subscription":{"endpoint":"https://push.example.invalid/book-smoke","keys":{"p256dh":"staging-p256dh","auth":"staging-auth"}}}' \
            "http://localhost:8080/api/online-booking/$tenant_id/account/push/subscription" >/dev/null
      - name: Stop isolated staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
