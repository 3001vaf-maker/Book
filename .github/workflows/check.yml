name: Check Book

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and architecture checks
        run: npm run check
      - name: Domain regression tests
        run: npm test
      - name: Validate staging compose
        run: docker compose -f docker-compose.staging.yml config >/dev/null
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Build server
        run: npm run build --prefix server

  staging-smoke:
    if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and start isolated staging
        run: docker compose -f docker-compose.staging.yml up --build -d
      - name: Verify staging backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          backend_ok=0
          frontend_ok=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then backend_ok=1; fi
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then frontend_ok=1; fi
            if [ "$backend_ok" = "1" ] && [ "$frontend_ok" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs
          exit 1
      - name: Stop isolated staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
