name: Check Book

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax and architecture checks
        run: npm run check
      - name: Domain regression tests
        run: npm test
      - name: Validate staging compose
        run: docker compose -f docker-compose.staging.yml config >/dev/null
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Build server
        run: npm run build --prefix server

  staging-smoke:
    if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build staging backend image
        run: docker compose -f docker-compose.staging.yml build backend
      - name: Start isolated database and backend
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          docker compose -f docker-compose.staging.yml up -d backend
      - name: Verify staging backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db backend
          exit 1
      - name: Start and verify staging frontend
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml up -d frontend
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core/environment.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/service-worker.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/online-booking/notifications.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core/notifications/web-push.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose -f docker-compose.staging.yml logs frontend backend
              exit 1
            fi
            sleep 2
          done

          staging_password=$(docker compose -f docker-compose.staging.yml exec -T backend printenv OWNER_PASSWORD | tr -d '\r')
          login_body=$(node -e 'process.stdout.write(JSON.stringify({email:"staging@book.local",password:process.argv[1]}))' "$staging_password")
          login_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$login_body" \
            http://localhost:8080/api/auth/login)
          access_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$login_payload")
          tenant_id=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.tenant?.id) process.exit(1); process.stdout.write(p.tenant.id)" "$login_payload")
          curl -fsS -H "Authorization: Bearer $access_token" http://localhost:8080/api/auth/me >/dev/null

          booking_password="Smoke-$(date +%s)-Aa1!"
          booking_body=$(node -e 'process.stdout.write(JSON.stringify({email:"push-smoke@book.local",password:process.argv[1],name:"Push",phone:"+79990000999",consents:[]}))' "$booking_password")
          booking_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$booking_body" \
            "http://localhost:8080/api/online-booking/$tenant_id/account/register")
          booking_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$booking_payload")
          booking_account_id=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.account?.id) process.exit(1); process.stdout.write(p.account.id)" "$booking_payload")

          # Reproduce the production failure: an existing visible thread still carries historical phone/UEI aliases,
          # while its Telegram Contact Point and BookingAccount are current.
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging \
            -v tenant_id="$tenant_id" -v account_id="$booking_account_id" <<'SQL'
          INSERT INTO "CommunicationIdentity" (
            "id", "tenantId", "bookingAccountId", "cardPhone", "uei", "channel", "externalUserId", "display", "verifiedAt", "createdAt", "updatedAt"
          ) VALUES (
            'smoke-telegram-identity', :'tenant_id', :'account_id', '79990000999', 'NEW1', 'TELEGRAM', '987654321', '@smoke', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          );

          INSERT INTO "CommunicationMessage" (
            "id", "tenantId", "cardPhone", "uei", "direction", "kind", "channel", "body", "externalMessageId", "externalThreadId", "status", "createdAt", "deliveredAt", "error"
          ) VALUES (
            'smoke-telegram-inbound', :'tenant_id', '70000000001', 'OLD1', 'inbound', 'message', 'TELEGRAM', 'stale thread', 'smoke-inbound-1', '987654321', 'delivered', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, ''
          );
          SQL

          reply_status=$(curl -sS -o /tmp/book-telegram-reply.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            -d '{"phone":"70000000001","uei":"OLD1","body":"smoke reply"}' \
            http://localhost:8080/api/communications/chat/messages)
          test "$reply_status" = "400"
          grep -q 'Нет действующего согласия на этот Telegram Contact Point' /tmp/book-telegram-reply.json
          if grep -q 'нет доступного двустороннего канала' /tmp/book-telegram-reply.json; then
            cat /tmp/book-telegram-reply.json
            exit 1
          fi

          push_config=$(curl -fsS \
            -H "Authorization: Bearer $booking_token" \
            "http://localhost:8080/api/online-booking/$tenant_id/account/push/config")
          node -e "const p=JSON.parse(process.argv[1]); if(!p.enabled || !p.publicKey) process.exit(1)" "$push_config"

          curl -fsS \
            -X PUT \
            -H "Authorization: Bearer $booking_token" \
            -H 'Content-Type: application/json' \
            -d '{"subscription":{"endpoint":"https://push.example.invalid/book-smoke","keys":{"p256dh":"staging-p256dh","auth":"staging-auth"}}}' \
            "http://localhost:8080/api/online-booking/$tenant_id/account/push/subscription" >/dev/null
      - name: Stop isolated staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
