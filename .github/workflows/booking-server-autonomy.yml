name: Booking Server Autonomy

on:
  push:
    branches: [feat/booking-server-autonomy]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/booking-server-autonomy
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply server autonomy
        run: |
          python scripts/_apply_booking_server_autonomy.py
          python scripts/_fix_booking_server_autonomy.py
          python scripts/_fix_uei_autonomy_check.py
      - name: Syntax and architecture checks
        run: npm run check
      - name: Domain regression tests
        run: npm test
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Build server
        run: npm run build --prefix server
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/booking-server-autonomy.yml scripts/_apply_booking_server_autonomy.py scripts/_fix_booking_server_autonomy.py scripts/_fix_uei_autonomy_check.py server/package-lock.json server/tsconfig.tsbuildinfo
          git config user.name "Book Server Autonomy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make online booking server autonomous"
          git push origin HEAD:feat/booking-server-autonomy
