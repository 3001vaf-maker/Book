name: Fix contact investment header context

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/fix-contact-investment-header.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Fix investment header context
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git diff --check
          grep -F "bindAccountInvestments(layer, root, state, handlers" online-booking/account-shell.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-booking/account-shell.js
          git commit -m "Fix contact investment header context"
          git push origin HEAD:staging
