name: Diagnose Check

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/diagnose-check.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture check output
        shell: bash
        run: |
          set +e
          npm run check > check.log 2>&1
          code=$?
          echo "$code" > check.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: check-diagnostics
          path: |
            check.log
            check.exit
