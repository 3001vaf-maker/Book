name: Patch payment Q runtime contract

on:
  push:
    branches:
      - fix/close-payment-stack-after-success

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply payment Q runtime contract patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/close-payment-stack-after-success
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch payment Q contract and browser regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          payment = Path('journal/record-payment.js')
          s = payment.read_text()
          old = """function mountPaymentQ(record, {\n  title = 'Оплата',\n  context = '',\n  className = '',\n  hostData = 'data-record-payment-q-host',\n} = {}) {\n  const layer = mountModal(document.body, modal(\n    `${context || blankPaymentContext(record, title)}<div class=\"record-screen record-screen--state-view\" ${hostData}></div>`,\n    { variant: 'q', surface: 'app', title, className },\n  ));"""
          new = """function mountPaymentQ(record, {\n  title = 'Оплата',\n  modalTitle = title,\n  context = '',\n  className = '',\n  hostData = 'data-record-payment-q-host',\n} = {}) {\n  const layer = mountModal(document.body, modal(\n    `${context || blankPaymentContext(record, title)}<div class=\"record-screen record-screen--state-view\" ${hostData}></div>`,\n    { variant: 'q', surface: 'app', title: modalTitle, className },\n  ));"""
          if old not in s:
              raise SystemExit('mountPaymentQ source contract not found')
          s = s.replace(old, new, 1)
          old = """  const layer = mountPaymentQ(current, {\n    title: 'Оплата',\n    className: 'record-payment-allocation-q',"""
          new = """  const layer = mountPaymentQ(current, {\n    title: 'Оплата',\n    modalTitle: 'Проведение оплаты',\n    className: 'record-payment-allocation-q',"""
          if old not in s:
              raise SystemExit('Q2 mount source contract not found')
          s = s.replace(old, new, 1)
          payment.write_text(s)

          runtime = Path('tests/professional-core-runtime-browser.html')
          s = runtime.read_text()
          s = s.replace("let paymentZ = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);", "let paymentQ = [...document.querySelectorAll('[data-v2-q=\"true\"]')].at(-1);")
          s = s.replace("paymentZ = [...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1);", "paymentQ = [...document.querySelectorAll('[data-v2-q=\"true\"]')].at(-1);")
          s = s.replace('paymentZ?', 'paymentQ?')
          s = s.replace('Payment Z3', 'Payment Q1')
          s = s.replace('Record C must open Payment Q1', 'Record C must open Payment Q1 over the existing Record Z2')
          anchor = """ok(Boolean(paymentQ?.querySelector('[data-payment-ui]')), 'Payment Q1 shared form missing');\nlet paymentPrice = paymentQ?.querySelector('[data-payment-price]');"""
          insert = """ok(Boolean(paymentQ?.querySelector('[data-payment-ui]')), 'Payment Q1 shared form missing');\nok([...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1) === recordZ,\n  'Payment Q1 must cover Record Z2 without creating another Z');\nlet paymentPrice = paymentQ?.querySelector('[data-payment-price]');"""
          if anchor not in s:
              raise SystemExit('payment Q1 browser anchor not found')
          s = s.replace(anchor, insert, 1)
          anchor = """ok(paymentPrice?.readOnly === false && !paymentPrice?.hasAttribute('readonly'),\n  'Reopened Payment price field must stay editable');\nwindow.fetch = originalPaymentFetch;\npaymentQ?.v2Close?.();"""
          insert = """ok(paymentPrice?.readOnly === false && !paymentPrice?.hasAttribute('readonly'),\n  'Reopened Payment price field must stay editable');\n\nmark('journal-record-payment-q2');\nshell()?.querySelector('[data-v2-workspace-primary]')\n  ?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));\nawait wait(80);\nconst paymentQs = [...document.querySelectorAll('[data-v2-q=\"true\"]')];\nconst paymentQ2 = paymentQs.at(-1);\nok(paymentQs.length === 2, 'Pay must open Q2 over Q1');\nok(paymentQ2 !== paymentQ && Boolean(paymentQ2?.querySelector('[data-record-payment-allocation-host]')),\n  'Q2 payment allocation form missing');\nok([...(shell()?.querySelectorAll('[data-v2-z-layer]') || [])].at(-1) === recordZ,\n  'Q2 must cover the same Record Z2 without creating Z3/Z4');\npaymentQ2?.v2Close?.();\nawait wait(25);\nwindow.fetch = originalPaymentFetch;\npaymentQ?.v2Close?.();"""
          if anchor not in s:
              raise SystemExit('payment Q2 browser anchor not found')
          s = s.replace(anchor, insert, 1)
          runtime.write_text(s)

          regression = Path('tests/record-payment-close-after-success.test.mjs')
          s = regression.read_text()
          anchor = """assert.match(source, /className: 'record-payment-allocation-q'/,\n  'payment allocation surface must be Q2');"""
          insert = """assert.match(source, /className: 'record-payment-allocation-q'/,\n  'payment allocation surface must be Q2');\nassert.match(source, /modalTitle: 'Проведение оплаты'/,\n  'Q2 must have a distinct application-modal key from Q1 so the shared Q owner does not reject it as a duplicate');"""
          if anchor not in s:
              raise SystemExit('Q2 regression anchor not found')
          regression.write_text(s.replace(anchor, insert, 1))
          PY
      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          git config user.name '3001vaf-maker'
          git config user.email '30.01vaf@gmail.com'
          git rm .github/workflows/patch-payment-q-runtime.yml
          git add journal/record-payment.js tests/professional-core-runtime-browser.html tests/record-payment-close-after-success.test.mjs
          git commit -m 'test: verify live Z2 to Q1 to Q2 payment contour'
          git push origin HEAD:fix/close-payment-stack-after-success
