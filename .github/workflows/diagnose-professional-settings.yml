name: Diagnose professional Settings E

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Settings access at browser failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/professional-core-runtime-browser.html')
          text = path.read_text()
          needle = """if (!target) {\n    ok(false, label + ' target card missing before selection');\n    return;\n  }"""
          replacement = """if (!target) {\n    const accessDebug = await import('/core/access.js');\n    const settingsDebug = await import('/settings/settings.js');\n    const caps = (accessDebug.getBookAccess()?.capabilities || []).map((item) => `${item.key}:${item.enabled}`).join('|');\n    const items = settingsDebug.settingsNavigationItems().map((item) => item.id).join('|');\n    result.textContent = `MISSING ${label} SETTINGS=${items} CAPS=${caps}`;\n    document.documentElement.dataset.professionalRuntimeStage = 'missing-' + label;\n    ok(false, label + ' target card missing before selection');\n    return;\n  }"""
          if needle not in text:
              raise SystemExit('diagnostic insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/tests/professional-core-runtime-browser.html >/dev/null && break || sleep .25; done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --force-device-scale-factor=1 --touch-events=enabled --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4173/tests/professional-core-runtime-browser.html > /tmp/dom.html || true
          grep -o 'data-professional-runtime-stage="[^"]*"' /tmp/dom.html || true
          grep -A2 -B1 '<pre id="result"' /tmp/dom.html || true
