name: One-shot contact point permission wiring

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-contact-permission-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Wire contact point consent decisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert old in s, f'anchor missing in {path}'
              p.write_text(s.replace(old, new, 1))

          # Online account registration: explicit registration consent gets scoped to current phone/email.
          replace_once(
              'server/src/online-booking/online-booking.service.ts',
              "import { DocumentStateService } from '../document-state/document-state.service';\n",
              "import { ConsentPolicyService } from '../document-state/consent-policy.service';\nimport { DocumentStateService } from '../document-state/document-state.service';\n",
          )
          replace_once(
              'server/src/online-booking/online-booking.service.ts',
              "    private readonly documentState: DocumentStateService,\n    private readonly profile: ProfileService,",
              "    private readonly documentState: DocumentStateService,\n    private readonly consentPolicy: ConsentPolicyService,\n    private readonly profile: ProfileService,",
          )
          replace_once(
              'server/src/online-booking/online-booking.service.ts',
              "    await this.documentState.recordAcceptedConsents(tenantId, text(binding.person.key), consents);\n    return {\n      accessToken: await this.issueAccountToken(account),",
              "    await this.documentState.recordAcceptedConsents(tenantId, text(binding.person.key), consents);\n    if (consents.some((item) => item.documentId === 'messages-consent' && item.accepted)) {\n      await this.consentPolicy.acceptContactPointConsent(tenantId, text(binding.person.key), 'PHONE', account.phone, 'messages-consent', 'online-booking-registration');\n      await this.consentPolicy.acceptContactPointConsent(tenantId, text(binding.person.key), 'EMAIL', account.email, 'messages-consent', 'online-booking-registration');\n    }\n    return {\n      accessToken: await this.issueAccountToken(account),",
          )

          # Telegram chat: permission is the concrete Telegram destination, never Person/UEI.
          p = Path('server/src/communication/telegram-bot.service.ts')
          s = p.read_text()
          s = s.replace("import { BusinessStateService } from '../business-state/business-state.service';\n", '', 1)
          s = s.replace("    private readonly notifications: NotificationService,\n    private readonly businessState: BusinessStateService,\n    private readonly consentPolicy: ConsentPolicyService,", "    private readonly notifications: NotificationService,\n    private readonly consentPolicy: ConsentPolicyService,", 1)
          s, count = re.subn(r"\n  private async personKeyForIdentity\([\s\S]*?\n  async sendChatMessage", "\n  async sendChatMessage", s, count=1)
          assert count == 1, 'personKeyForIdentity block not found'
          old = "    const personKey = await this.personKeyForIdentity(tenantId, identity);\n    if (!personKey || !(await this.consentPolicy.canSendMessages(tenantId, personKey))) throw new BadRequestException('Нет действующего согласия на сообщения');"
          new = "    if (!(await this.consentPolicy.canSendMessages(tenantId, 'TELEGRAM', identity.externalUserId))) throw new BadRequestException('Нет действующего согласия на этот Telegram Contact Point');"
          assert old in s, 'telegram permission anchor missing'
          p.write_text(s.replace(old, new, 1))

          # Broadcast preview: resolve actual destination first, then ask permission for that exact Contact Point.
          replace_once(
              'server/src/communication/communication-broadcast.service.ts',
              "  private async channelAvailable(tenantId: string, channel: string, person: { phone: string; uei: string; email: string }) {\n    if (channel === 'TELEGRAM') return Boolean(await this.communications.telegramIdentity(tenantId, { phone: person.phone, uei: person.uei }));\n    return false;\n  }",
              "  private async channelDestination(tenantId: string, channel: string, person: { phone: string; uei: string; email: string }) {\n    if (channel === 'TELEGRAM') {\n      const identity = await this.communications.telegramIdentity(tenantId, { phone: person.phone, uei: person.uei });\n      return text(identity?.externalUserId);\n    }\n    return '';\n  }",
          )
          replace_once(
              'server/src/communication/communication-broadcast.service.ts',
              "    for (const person of requested) {\n      if (!(await this.documents.canSendMessages(tenantId, person.personKey))) { excluded.push({ personKey: person.personKey, phone: person.phone, reason: 'no-consent' }); continue; }\n      if (!(await this.channelAvailable(tenantId, channel, person))) { excluded.push({ personKey: person.personKey, phone: person.phone, reason: 'no-channel' }); continue; }\n      audience.push(person);\n    }",
              "    for (const person of requested) {\n      const destination = await this.channelDestination(tenantId, channel, person);\n      if (!destination) { excluded.push({ personKey: person.personKey, phone: person.phone, reason: 'no-channel' }); continue; }\n      if (!(await this.documents.canSendMessages(tenantId, channel, destination))) { excluded.push({ personKey: person.personKey, phone: person.phone, reason: 'no-consent' }); continue; }\n      audience.push(person);\n    }",
          )

          # Notifications: Push is technical; external message channels require consent on their own destination.
          replace_once(
              'server/src/notification/notification.service.ts',
              "  private async externalAllowed(tenantId: string, identity: Awaited<ReturnType<NotificationService['accountIdentity']>>) {\n    if (!identity.personKey) return false;\n    return this.documents.canSendMessages(tenantId, identity.personKey);\n  }",
              "  private async externalAllowed(tenantId: string, identity: Awaited<ReturnType<NotificationService['accountIdentity']>>, channel: string) {\n    if (channel === 'PUSH') return true;\n    const recipient = this.recipientForChannel(identity, channel);\n    if (!recipient) return false;\n    return this.documents.canSendMessages(tenantId, channel, recipient);\n  }",
          )
          replace_once(
              'server/src/notification/notification.service.ts',
              "    if (!(await this.externalAllowed(tenantId, identity))) return [];\n    const policy = await this.getRoutingPolicy(tenantId, eventType);",
              "    const policy = await this.getRoutingPolicy(tenantId, eventType);",
          )
          replace_once(
              'server/src/notification/notification.service.ts',
              "    const configured = policy.channels.filter((channel) => ACTIVE_EXTERNAL_CHANNELS.has(channel));\n    const available = configured\n      .map((channel) => ({ channel, recipient: this.recipientForChannel(identity, channel) }))\n      .filter((item) => item.recipient);",
              "    const configured = policy.channels.filter((channel) => ACTIVE_EXTERNAL_CHANNELS.has(channel));\n    const available: Array<{ channel: string; recipient: string }> = [];\n    for (const channel of configured) {\n      const recipient = this.recipientForChannel(identity, channel);\n      if (!recipient || !(await this.externalAllowed(tenantId, identity, channel))) continue;\n      available.push({ channel, recipient });\n    }",
          )
          replace_once(
              'server/src/notification/notification.service.ts',
              "    return Boolean(identity && await this.externalAllowed(tenantId, identity));",
              "    return Boolean(identity && await this.externalAllowed(tenantId, identity, channel));",
          )
          replace_once(
              'server/src/notification/notification.service.ts',
              "        if (identity && await this.externalAllowed(tenantId, identity)) {\n          for (const nextChannel of nextChannels) {\n            if (!ACTIVE_EXTERNAL_CHANNELS.has(nextChannel)) continue;\n            const recipient = this.recipientForChannel(identity, nextChannel);\n            if (!recipient) continue;\n            await this.queueDelivery(tenantId, current.notificationId, nextChannel, recipient);\n            break;\n          }\n        }",
              "        if (identity) {\n          for (const nextChannel of nextChannels) {\n            if (!ACTIVE_EXTERNAL_CHANNELS.has(nextChannel)) continue;\n            const recipient = this.recipientForChannel(identity, nextChannel);\n            if (!recipient || !(await this.externalAllowed(tenantId, identity, nextChannel))) continue;\n            await this.queueDelivery(tenantId, current.notificationId, nextChannel, recipient);\n            break;\n          }\n        }",
          )

          Path('.github/workflows/staging-contact-permission-fix.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/src/online-booking/online-booking.service.ts server/src/communication/telegram-bot.service.ts server/src/communication/communication-broadcast.service.ts server/src/notification/notification.service.ts .github/workflows/staging-contact-permission-fix.yml
          git commit -m "Wire messaging permission to contact points"
          git push origin HEAD:staging
