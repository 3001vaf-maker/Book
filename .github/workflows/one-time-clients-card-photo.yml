name: One-time Clients card photo fix

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  fix-client-card-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse canonical finance card photo
        run: |
          python - <<'PY'
          from pathlib import Path
          finance = Path('core/finance/index.js')
          source = finance.read_text()
          old = "  cashEntityCardAppearance,\n  cashEntityCardFields,\n} from './cash/card-presentation.js';"
          new = "  cashEntityCardAppearance,\n  cashEntityCardFields,\n  cashEntityCardPhoto,\n} from './cash/card-presentation.js';"
          if old in source:
              finance.write_text(source.replace(old, new, 1))
          elif 'cashEntityCardPhoto,' not in source:
              raise SystemExit('finance card presentation export not found')

          people = Path('core/people/programs.js')
          source = people.read_text()
          old = "  cashEntityCardFields,\n  getFinanceEntityMovements,"
          new = "  cashEntityCardFields,\n  cashEntityCardPhoto,\n  getFinanceEntityMovements,"
          if old in source:
              source = source.replace(old, new, 1)
          elif 'cashEntityCardPhoto,' not in source:
              raise SystemExit('people finance import not found')
          source = source.replace("    image: String(entity.photo || ''),", "    image: cashEntityCardPhoto(entity, kind),")
          people.write_text(source)
          PY
          if git diff --quiet -- core/finance/index.js core/people/programs.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/finance/index.js core/people/programs.js
          git commit -m "Reuse canonical finance card photo in Clients"
          git push origin HEAD:staging
